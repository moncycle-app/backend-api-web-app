; PROD IS THE DEFAULT: every ${VAR:-default} below is the production value when its variable is not set.
; Dev opts in with one env file (dev.env.example): `docker run --env-file dev.env` / compose `env_file`.

; errors: logged through Apache's ErrorLog (stderr, so `docker logs`, with the client IP), shown only if PHP_SHOW_ERR=On
log_errors = On
display_errors = ${PHP_SHOW_ERR:-Off}
display_startup_errors = ${PHP_SHOW_ERR:-Off}
; NUMBERS ONLY: a constant name ("E_ALL") in an env variable is read as 0, which silences everything.
; 24575 = E_ALL & ~E_DEPRECATED (the QR library raises deprecations on every /api/totp), 32767 = E_ALL
error_reporting = ${PHP_ERROR_REPORTING:-24575}
html_errors = 0
ignore_repeated_errors = On
; -1 in prod (assert() is not even compiled), 1 in dev
zend.assertions = ${PHP_ASSERTIONS:--1}

; the app stores UTC
date.timezone = UTC

; caching php files. The code is baked in the image (a deploy is a rebuild), so files are never
; re-checked: with PHP_CACHE on and a bind-mounted www_data, restart the container after each edit.
opcache.enable = ${PHP_CACHE:-1}
opcache.enable_cli = 0
opcache.validate_timestamps = 0
; ~370 files in the image (app + vendor): a full table makes OPcache schedule a restart
opcache.max_accelerated_files = 1000
; PHP 8.4 defaults the JIT buffer to 64M: keep it off, an I/O-bound API gains nothing from it
opcache.jit = off
opcache.jit_buffer_size = 0

; hardening
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
max_input_time = 30
max_execution_time = 30
memory_limit = 32M
; coupled with NFP_LIMIT_BODY_BYTES (constants.php): change both or neither
post_max_size = 256K
max_input_vars = 1000
file_uploads = Off
; /var/log/moncycle: the one directory LOG_OUTPUT may name a file in (README, "Logs")
open_basedir = /var/www/html:/run/secrets:/var/log/moncycle
; defence in depth, not a sandbox. Not disabled on purpose: fsockopen, stream_socket_client (SMTP)
disable_functions = chgrp,chmod,chown,curl_exec,curl_multi_exec,diskfreespace,dl,exec,fpassthru,get_current_user,getlastmod,getmyinode,getmypid,getmyuid,highlight_file,ini_alter,ini_restore,ini_set,lchgrp,lchown,link,mail,mb_send_mail,parse_ini_file,passthru,pcntl_exec,pfsockopen,php_ini_loaded_file,php_ini_scanned_files,php_uname,phpcredits,phpinfo,popen,posix_ctermid,posix_getcwd,posix_getegid,posix_geteuid,posix_getgid,posix_getgrgid,posix_getgrnam,posix_getgroups,posix_getlogin,posix_getpgid,posix_getpgrp,posix_getpid,posix_getppid,posix_getpwnam,posix_getpwuid,posix_getrlimit,posix_getsid,posix_getuid,posix_isatty,posix_kill,posix_mkfifo,posix_setegid,posix_seteuid,posix_setgid,posix_setpgid,posix_setsid,posix_setuid,posix_times,posix_ttyname,posix_uname,proc_close,proc_get_status,proc_nice,proc_open,proc_terminate,putenv,set_time_limit,shell_exec,show_source,stream_socket_server,symlink,system,tmpfile,virtual
