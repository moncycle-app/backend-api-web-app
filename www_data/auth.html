<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title>moncycle.app - authentification</title>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
		<meta name="apple-mobile-web-app-title" content="moncycle.app" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<link rel="apple-touch-icon" href="/img/moncycleapp512.jpg" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="white" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="black" />
		<meta name="apple-mobile-web-app-status-bar-style" media="(prefers-color-scheme: light)" content="light-content" />
		<meta name="apple-mobile-web-app-status-bar-style" media="(prefers-color-scheme: dark)" content="dark-content" />
		<meta name="description" content="Application de suivi de cycle pour les méthodes naturelles de régulation des naissances." />
		<meta property="og:title" content="MONCYCLE.APP" />
		<meta property="og:type" content="siteweb" />
		<meta property="og:url" content="https://www.moncycle.app/" />
		<meta property="og:image" content="/img/moncycleapp_apercu.jpg" />
		<meta property="og:description" content="Application de suivi de cycle pour les méthodes naturelles de régulation des naissances." />
		<script type="text/javascript" src="vendor/components/jquery/jquery.min.js"></script> 
		<script type="text/javascript" src="js/store.js"></script>
		<link rel="stylesheet" href="css/commun.css" />
		<link rel="stylesheet" href="css/account.css" />
		<style>
			.contennu {
				max-width: 370px;
			}
		</style>
	</head>
	<body>
		<center>
			<h1>mon<span class="gradiant_logo">cycle</span>.app</h1>
			<a href="register"><button type="button" class="nav_button">Créer un compte 🚀</button></a>
			<a href="https://www.moncycle.app" target="_blank"><button type="button" class="nav_button">Découvrir MON<b>CYCLE</b>.APP 😍</button></a>
		</center>
		<div class="contennu" id="timeline">
			<h2>Connexion à votre compte</h2>
			<span class="rouge" id="message_err"></span>
			<form method="post" action="api/login" id="connexion_form"><br />
			<label for="i_email1">E-mail:</label><br />
			<input name="email1" id="i_email1" type="email" required placeholder="adresse mail de connexion"  value="" /><br />
			<br />
			<label for="i_password">Mot de passe:</label><br />
			<input name="password" id="i_password" type="password" required placeholder="mot de passe moncycle.app"  value="" /><br />
			<br />
			<label for="i_code">Code:</label><br />
			<input name="code" id="i_code" type="number" placeholder="authentification multifacteur (si activée)" value="" /><br />
			<br />
			<div id="captcha_wrapper" style="display:none">
				<label for="i_captcha">Captcha:</label><br />
				<input name="captcha" id="i_captcha" type="text" maxlength="6" placeholder="Entrer les lettres ou chiffres affichés ci-dessous." /><br />
				<img src="api/captcha.php" class="captcha" id="l_captcha" /><br />
				<br />
			</div>
			<input type="submit" value="Connexion 🔑" id="connexion_but"/></form>
			<br /><br /><br />
			<center><a class="register_commente" id="but_demo_bill" href="/auth">compte de démo <b>Billings</b> 🥸</a></center>
			<center><a class="register_commente" id="but_demo_fc" href="/auth">compte de démo <b>FertilityCare</b> 🧐</a></center>
			<br /><br />
			<h2>Mot de passe perdu</h2>
			<span id="password_reseted_msg" class="vert"></span>
			<form method="post" action="api/recover_password" id="reset_form"><br />
				<label for="r_email1">E-mail:</label><br />
				<input name="email1" id="r_email1" type="email" required placeholder="adresse mail de connexion"  value="" /><br />
				<br />
				<input type="submit" value="Rénitialiser 🤐" id="reset_but"/></form>
				<br /><br /><br />
			</form>
			
		</div>

		<script>
			window.addEventListener("storage", function () {
				if (parseInt(localStorage.auth)>0) {
				window.location.replace('..');
			}
			}, false);
			if (parseInt(localStorage.auth)>0) {
				window.location.replace('..');
			}
			else {
				moncycle_store.clear_storage();
				$(document).ready(function(){
					$("#connexion_form").on("submit", function(event) {
						event.preventDefault();
						$("#connexion_but").prop("disabled", true);
						$("#connexion_but").val("Connexion ⏳");
						var payload = {
							email: $("#i_email1").val(),
							password: $("#i_password").val(),
						};
						if ($("#i_code").val()) payload.code = parseInt($("#i_code").val());
						if ($("#captcha_wrapper").is(":visible")) payload.captcha = $("#i_captcha").val();
						$.ajax({
							type: "POST",
							url: "api/login",
							contentType: "application/json",
							data: JSON.stringify(payload),
						}).done(function(ret){
							console.log(ret);
							localStorage.auth = ret.data.userId;
							window.location.replace('..');
						}).fail(function(jqXHR){
							$("#connexion_but").prop("disabled", false);
							$("#connexion_but").val("Connexion 🔑");
							var err = (jqXHR.responseJSON || {}).error || {};
							const return_codes = {
								login_disabled : "La connexion est désactivée.",
								missing_credentials : "E-mail et/ou mot de passe manquant.",
								account_disabled : "Compte désactivé.",
								totp_required : "Bon mot de passe, mais un code TOTP est requis.",
								totp_invalid : "Bon mot de passe, mais le code TOTP est incorrect.",
								invalid_credentials : "Mauvais mot de passe ou compte inexistant.",
								captcha_required : "Captcha manquant ou incorrect.",
								account_locked : "Compte temporairement bloqué après trop de tentatives échouées, réessayez plus tard.",
								rate_limited : "Trop de tentatives depuis ce réseau, réessayez plus tard."
							};
							if ((err.details || {}).captchaRequired) $("#captcha_wrapper").show();
							$("#message_err").html((return_codes[err.code] || err.message || "Erreur inconnue.") + "<br />");

							// the captcha is single-use server-side, refresh it whenever it was shown for this attempt
							if ($("#captcha_wrapper").is(":visible")) {
								$("#l_captcha").attr("src", "api/captcha.php?v=" + new Date().getTime());
								$("#i_captcha").val('');
							}
						});
					});
					$("#reset_form").on("submit", function(event) {
						event.preventDefault();
						$("#reset_but").prop("disabled", true);
						$("#reset_but").val("Rénitialiser ⏳");
						var email = $("#r_email1").val();
						$.ajax({
							type: "POST",
							url: "api/recover_password",
							contentType: "application/json",
							data: JSON.stringify({email: email}),
						}).done(function(ret){
							console.log(ret);
							$("#reset_but").val("Rénitialiser 🤐");
							$("#reset_but").prop("disabled", false);
							if (ret.data && ret.data.sent) {
								$("#reset_form").hide();
								$("#password_reseted_msg").html("📧 Nouveau mot de passe envoyé par mail à : <br /><b>" + email + "</b><br /><br />(si ce compte existe)");
							}
						}).fail(function(jqXHR){
							$("#reset_but").val("Rénitialiser 🤐");
							$("#reset_but").prop("disabled", false);
							console.error(jqXHR);
						});
					});
					const email1 = (new URLSearchParams(window.location.search)).get("email1");
					$("#i_email1").val(email1);
					$("#but_demo_bill").on("click", function(event) {
						event.preventDefault();
						$("#i_email1").val("demo.bill@moncycle.app");
						$("#i_password").val("demo");
						$("#connexion_form").submit();
					});
					$("#but_demo_fc").on("click", function(event) {
						event.preventDefault();
						$("#i_email1").val("demo.fc@moncycle.app");
						$("#i_password").val("demo");
						$("#connexion_form").submit();
					});
				});
			}
		</script>
	</body>
</html>
