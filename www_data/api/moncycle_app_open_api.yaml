openapi: 3.0.3

info:
  title: moncycle.app API
  version: "2.0"
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0
  description: |-
    This API stores **daily fertility observations** for one person, or for one couple sharing
    an account. It is the backend of the moncycle.app web app. Other clients (mobile apps,
    scripts, research tools) can use the same API.

    This page is written to be read from top to bottom the first time. After that, use it as a
    reference. Plain English is used on purpose, so that non-native speakers can read it
    quickly. Domain words (peak day, stamp, Billings…) are explained in the
    **Glossary** at the end.

    ---

    ## 1. The one idea you need

    **One day = one observation.**

    The account owns a **timeline**: a long list of calendar days. Each day holds what the user
    observed on that date. There is no "cycle" resource, no "chart" resource, no "entry id".
    The calendar date *is* the identifier.

    ```
    timeline of one account
    ┌──────────┬──────────┬──────────┬──────────┬──────────┬──────────┐
    │2026-03-08│2026-03-09│2026-03-10│2026-03-11│2026-03-12│2026-03-13│
    ├──────────┼──────────┼──────────┼──────────┼──────────┼──────────┤
    │          │          │ cycle    │          │ isPeak   │          │
    │ stamp    │ stamp    │ FirstDay │ stamp    │ = true   │ stamp    │
    │ = Green  │ = Green  │ = true   │ = Red    │          │ = White  │
    └──────────┴──────────┴──────────┴──────────┴──────────┴──────────┘
                           ^
                           └─ a new cycle starts here
    ```

    A **cycle is not stored**. It is *derived* from the timeline. One day carries the flag
    `cycleFirstDay: true`, and that is all the server needs:

    - the cycle of any date = the closest day at or before it that has `cycleFirstDay: true`;
    - `cycleStartDate` and `cycleDay` are **computed by the server** on every read.

    So, to start a new cycle, you do not create anything. You write one day with
    `cycleFirstDay: true`. To correct a wrong cycle start, you write that same day again with
    `cycleFirstDay: false`. Everything after it moves to the previous cycle automatically.

    This is the whole mindset of the API. Keep it in mind and the rest follows.

    ## 2. Three rules for every response

    **Rule 1 — success is wrapped in `data`.**

    ```json
    { "data": { "status": "ok" } }
    ```

    **Rule 2 — failure is wrapped in `error`.**

    ```json
    { "error": { "code": "invalid_credentials", "message": "Incorrect password or non-existent account." } }
    ```

    Read `code` in your program. It is a stable slug and it will not change.
    Show `message` to a human, or log it. Never parse it. An optional `details` object may
    carry extra context.

    **Rule 3 — the HTTP status code is real.** `200` means it worked. `401` means you are not
    logged in. `409` means a conflict. Check the status first, then the body.

    ### Exceptions to rule 1 and 2

    Four endpoints are older or serve files. They do **not** use the `data` / `error` envelope.
    This is the complete list, so you never have to guess:

    | Endpoint | What it returns instead |
    |---|---|
    | `GET /version` | a plain JSON object (a static file) |
    | `GET /pub_stat` | a plain JSON object |
    | `GET /export` | a file (`.nfp` JSON, `.csv` or `.pdf`); errors are **plain text in French** |
    | `GET /all_of_my_data_plz` | a CSV file; `401` has no body |

    `GET /logout` is also special: it answers with an HTTP redirect, not a body.

    ## 3. Authentication

    There is one credential: a **token**. You get it from `POST /login`.

    The token is a random 256-character string. Send it back in one of two ways — both work on
    every protected endpoint, so pick the one that fits your client:

    ```
    Authorization: Bearer <token>          <- apps, scripts, mobile clients
    Cookie: MONCYCLEAPP_TOKEN=<token>      <- browsers (the server sets this cookie for you)
    ```

    If both are present, the `Authorization` header wins.

    Good to know:

    - The token **does not expire** on its own. The cookie is set for 5 years.
    - There is no refresh step. There are no scopes and no roles.
    - `GET /logout` destroys **one** token (the one you used), not all of them.
    - One account can hold many valid tokens at the same time (one per device).
    - Missing or wrong token on a protected endpoint → `401` with code `unauthorized`.

    ## 4. First run, step by step

    Creating an account needs a captcha, and a captcha needs a cookie. So use a cookie jar
    (`-c` / `-b` in curl) for these two calls.

    ```bash
    # 1. Get a captcha image. This also sets the MONCYCLEAPP_TOKEN cookie.
    curl -s -c jar.txt http://localhost:8003/api/captcha -o captcha.jpg
    # ... a human reads captcha.jpg, for example "a7k2f"

    # 2. Create the account. The password is generated by the server and emailed.
    curl -s -b jar.txt -c jar.txt -X POST http://localhost:8003/api/register \
      -H 'Content-Type: application/json' \
      -d '{"firstName":"Marie","email":"marie@example.org","birthYear":1994,
           "method":"billings","temperatureTracking":false,"captcha":"a7k2f"}'
    # -> 201 {"data":{"userId":42,"email":"...","name":"Marie","welcomeEmailSent":true}}
    ```

    **You do not choose the password.** The server generates one and sends it by email. The
    user can change it later with `POST /password_change`.

    Then log in and keep the token:

    ```bash
    curl -s -X POST http://localhost:8003/api/login \
      -H 'Content-Type: application/json' \
      -d '{"email":"marie@example.org","password":"<from the email>"}'
    # -> 200 {"data":{"token":"abc...256 chars...","userId":42,"totpUsed":false}}
    ```

    ## 5. Daily use, step by step

    ```bash
    TOKEN=abc...   # from /login
    AUTH="Authorization: Bearer $TOKEN"

    # Who am I, and what are my settings? Call this once at startup.
    curl -s -H "$AUTH" http://localhost:8003/api/key_infos

    # Write today. Day 1 of a new cycle, red stamp, one free-text sensation.
    curl -s -H "$AUTH" -H 'Content-Type: application/json' \
      -X POST http://localhost:8003/api/day \
      -d '{"date":"2026-03-10","cycleFirstDay":true,"stampColor":"Red",
           "freeMucusSensation":["dry"],"comment":"cramps in the morning"}'
    # -> 201 (day created) with the full day as the server now stores it

    # Read one week back
    curl -s -H "$AUTH" \
      'http://localhost:8003/api/day?start_date=2026-03-04&end_date=2026-03-10'
    ```

    ### The most important write rule: POST /day replaces the whole day

    `POST /day` is an **upsert of the complete day**, not a partial patch. Any field you leave
    out is written as empty or `false`. There is no `PATCH`.

    ```
    stored:  { date: 2026-03-10, stampColor: "Red", isPeak: true, comment: "cramps" }
    you send:{ date: 2026-03-10, stampColor: "Green" }
    result:  { date: 2026-03-10, stampColor: "Green", isPeak: false, comment: "" }
                                                      ^^^^^^^^^^^^^  ^^^^^^^^^^^^
                                                      both were silently cleared
    ```

    **Always read the day, change the fields you want, then send the whole object back.**
    The response body is the day as the server stored it, so you can use it to refresh your
    local copy without a second `GET`.

    ## 6. Dates, times and null

    | Thing | Format | Example |
    |---|---|---|
    | A calendar date | `YYYY-MM-DD` | `2026-03-10` |
    | A time of day | `hh:mm:ss` | `06:45:00` |
    | A timestamp | ISO 8601 **UTC**, ends with `Z` | `2026-03-10T05:32:48Z` |

    Timestamps are always UTC. The server never sends a local offset such as `+02:00`, and it
    ignores one if you send it. Convert to local time in your client.

    Two timestamps appear on days, descriptions and the account:

    - **`lastWriteClientUtc`** — *your* clock. You send it. If you omit it, or it is not valid,
      the server writes its own clock instead. This is the field `GET /sync` filters on.
    - **`lastWriteDb`** — the server clock. Read-only. The server always sets it.

    A field that is `null` means "no value recorded". An empty array (`[]`) means "no labels".
    An empty string (`""`) is used for `comment` when there is no comment. Booleans are real
    JSON booleans (`true` / `false`), never the strings `"true"` / `"false"`.

    ## 7. Two tracking methods

    Each account uses one method, chosen at registration and changeable later on
    `POST /account`. The method decides **which fields of a day make sense**. The server does
    not block the other fields, but the app will not display them.

    | Method | How a day is recorded | Fields used |
    |---|---|---|
    | `billings` | free text, chosen by the user | `freeMucusSensation`, `freeMucusObservation` |
    | `fertilityCare` | short standard codes | the six `codified*` fields |

    Common to both: `stampColor`, `stampBaby`, `isPeak`, `cycleFirstDay`, `sexUnion`,
    `temperature`, `comment`, and the rest.

    `temperatureTracking` is a separate boolean. It says whether the user also records basal
    body temperature. So there are four real combinations, for example
    `billings` + temperature, or `fertilityCare` without temperature.

    ### Free-text labels are shared objects (Billings)

    In Billings mode, a user writes labels like "dry", "sticky", "clear and stretchy". These
    are **not** free strings stored on the day. Each label is a reusable object called a
    **description**, with its own `id` and a `useCount`.

    You never have to create them by hand. When you send a new name inside
    `freeMucusSensation` or `freeMucusObservation`, `POST /day` creates the description for you
    and links it to the day. The `/description` endpoints exist so the app can show a
    "most used first" picklist, and rename or delete a label everywhere at once.

    Two things to know:

    - Names are **unique per account** and **case-sensitive**. `"Dry"` and `"dry"` are two
      different labels.
    - A name keeps the type it was first created with. If "dry" already exists as an
      `observation`, sending it inside `freeMucusSensation` links the existing `observation`
      label. It does not create a second one.

    ## 8. Keeping two clients in sync

    `GET /sync?fromTimestamp=...` returns every day and every description whose
    `lastWriteClientUtc` is **greater than or equal to** the timestamp you pass. Use it like
    this:

    ```
    1. remember the timestamp of your last successful sync   (lastSync)
    2. GET /sync?fromTimestamp=<lastSync>
    3. merge the returned days and descriptions into your local store
    4. POST your own local changes to /day and /description
    5. save the new lastSync
    ```

    Three honest limits, so you do not debug them yourself:

    - **The filter uses the client clock**, not the server clock. If a client has a wrong
      clock, its writes can land outside the window and be missed. Subtract a safety margin
      from `lastSync` (a few minutes) and make your merge idempotent.
    - **The bound is inclusive** (`>=`). The last record of a sync comes back again on the next
      one. Your merge must tolerate that.
    - **Deletions are not reported.** A deleted *day* comes back as a blanked day, so you do
      see it. A deleted *description* simply disappears from the list, with no tombstone. To
      detect that, compare with a full `GET /description`.

    ## 9. Login protection

    Failed logins are counted per account, and they decay after **60 minutes** of no failure.

    | Recent failures on the account | What happens |
    |---|---|
    | 0 – 2 | normal login |
    | 3 or more | a captcha is required: `403` `captcha_required` |
    | 15 or more | account temporarily locked: `403` `account_locked` |

    There is also a limit of **30 attempts per IP address**, which answers `429` `rate_limited`.

    Every `/login` response — success or failure — may contain `captchaRequired: true`. It is a
    hint about your **next** attempt, not about this one. When you see it, fetch
    `GET /captcha` and include the answer in the next login.

    The lock only applies to a **wrong** password. The real owner can still log in with the
    correct password, so a third party cannot lock someone out.

    ## 10. Privacy by design

    This is personal data, so the API is deliberately narrow:

    - An account can only ever read and write **its own** data. There is no admin endpoint, no
      user list, and no way to address another account.
    - `GET /pub_stat` is public but rounded (to the nearest 10, or 100 for observations), so no
      individual can be recognised.
    - `POST /recover_password` always answers `200`, even when the email is unknown, and waits
      a random 1–5 seconds. This hides whether an account exists.
    - `GET /all_of_my_data_plz` gives the user a full CSV dump of their own data (GDPR right of
      access). Passwords, TOTP secrets and tokens are masked in it.
    - `DELETE /account` deletes the account for real. Rows in every other table are removed by
      database cascade. It needs the password as confirmation.
    - An account with no activity for 4 years is deleted automatically.

    ## 11. Glossary

    | Term | Meaning |
    |---|---|
    | **NFP** | Natural Family Planning. A family of methods based on daily body observations. |
    | **Billings** | The Billings Ovulation Method. The user describes mucus in their own words. |
    | **FertilityCare** | The Creighton Model FertilityCare System. The user records short standard codes such as `10KL` or `6C`. |
    | **Cycle** | The period from one first day of menstruation to the day before the next one. |
    | **Day 1** | The first day of a cycle. In this API, the day flagged `cycleFirstDay: true`. |
    | **Stamp** | The coloured square drawn on the paper chart for one day. Red, green, yellow or white. |
    | **Baby stamp** | A small baby picture added on top of a stamp, to mark a potentially fertile day. |
    | **Peak day** | The last day with the most fertile type of mucus. A cycle can hold more than one `isPeak` day. |
    | **Sensation** | What the user *feels* (for example "dry"). |
    | **Observation** | What the user *sees* (for example "stretchy"). |
    | **Description** | A reusable free-text label in this API, either a sensation or an observation. |
    | **Basal temperature** | Body temperature taken at rest, right after waking up. |
    | **TOTP** | Time-based One-Time Password. The 6-digit code from an app such as Aegis or Google Authenticator. Used for two-factor authentication. |
    | **NFP file** | The portable JSON file format used by `/export` and `/import`, so a user can move data between apps. |
    | **Upsert** | A write that creates the record if it does not exist, and replaces it if it does. |

externalDocs:
  description: moncycle.app website
  url: https://www.moncycle.app

servers:
  - url: .
    description: The server this documentation page is served from (relative paths).
  - url: https://tableau.moncycle.app/api
    description: Production.
  - url: http://localhost:8003/api
    description: Local development (docker).

# Every endpoint needs a token, unless it declares `security: []`.
security:
  - HTTPtoken: []
  - HTTPcookie: []

tags:
  - name: general
    description: |-
      Public endpoints. No token, no personal data. Use them for monitoring, for a version
      check at client startup, and for the public counters on the website.
  - name: account
    description: |-
      The account lifecycle: register, captcha, log in, log out, change or recover the
      password, two-factor authentication, change settings, delete the account.

      Read **section 3 and 4** of the introduction first. The order of the calls matters,
      because the captcha is tied to a cookie.
  - name: observations
    description: |-
      The heart of the API: the timeline of days, the reusable free-text labels, the account
      summary, and the sync endpoint.

      Read **section 1** of the introduction first ("one day = one observation"), and
      **section 5** before your first write (`POST /day` replaces the whole day).
  - name: files
    description: |-
      Import and export. Both speak the portable **NFP file format**, which is versioned on its
      own (`schemaVersion`) and shared with other NFP apps.

      `/export` returns a **file**, not a live resource, so it does not use the `data` / `error`
      envelope — its errors are plain text in French. `/import` takes a file but answers like
      the rest of the API, with `data` on success and `error` on failure.

paths:

  # ---------------------------------------------------------------------------
  # GENERAL
  # ---------------------------------------------------------------------------

  /version:
    get:
      tags: [general]
      summary: Server and API version
      description: |-
        A static JSON file. **No `data` envelope.** Call it at client startup to check which
        server you are talking to, and to warn the user if your client is too old.

        `version` is a plain number. During a development cycle it carries the suffix `dev`,
        for example `"15dev"`.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    type: string
                    example: moncycle.app
                  version:
                    type: string
                    description: Plain number, with the suffix `dev` on a development server.
                    example: "15dev"
                  build:
                    type: string
                    description: Build date, `YYYY-MM-DD`. The placeholder `YYYY-MM-DD` on a development server.
                    example: "2026-03-01"
                  commit:
                    type: string
                    description: Short git commit hash. The placeholder `xxxxxxxx` on a development server.
                    example: 5d81638a

  /health_check:
    get:
      tags: [general]
      summary: Is the server alive?
      description: |-
        For monitoring. The server answers `200` only if it can reach the database **and** get
        the expected result from a real query. Any other case is `503`.

        Nothing is written and nothing personal is read, so you can poll this often.
      security: []
      responses:
        "200":
          description: The server and the database both work.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [ok]
        "503":
          description: "`database_unreachable` — the database is down, or the query failed."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /pub_stat:
    get:
      tags: [general]
      summary: Public counters
      description: |-
        Public, anonymous usage counters, used on the website. **No `data` envelope.**

        Every number is **rounded on purpose** so that no individual can be recognised:
        accounts and cycles to the nearest 10, observations to the nearest 100. A small
        instance can therefore report `0`.

        Side effect: calling this endpoint increases the internal daily, weekly and monthly
        visit counters. Do not use it as a health check — use `GET /health_check`.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  moncycle_app_nb_user_account:
                    type: integer
                    description: Number of accounts, rounded to the nearest 10.
                    example: 1250
                  moncycle_app_nb_cycle:
                    type: integer
                    description: Number of recorded cycles, rounded to the nearest 10.
                    example: 8430
                  moncycle_app_nb_total_observation:
                    type: integer
                    description: Number of recorded days, rounded to the nearest 100.
                    example: 241500

  # ---------------------------------------------------------------------------
  # ACCOUNT
  # ---------------------------------------------------------------------------

  /register:
    post:
      tags: [account]
      summary: Create an account
      description: |-
        Creates an account and **emails a generated password** to the address you give.

        The caller does not choose the password. This is intentional: it proves the user owns
        the mailbox, and it avoids weak passwords. The user can change it afterwards with
        `POST /password_change`.

        ### Order of calls

        1. `GET /captcha` — this sets the `MONCYCLEAPP_TOKEN` cookie and stores a challenge.
        2. A human reads the image.
        3. `POST /register`, **sending that same cookie back**, with the answer in `captcha`.

        Without the cookie from step 1, the captcha can never match and you always get `403`.
        Each captcha works **once**: a failed registration needs a fresh `GET /captcha`.

        ### Partial success

        `welcomeEmailSent: false` with status `201` means the account **was created** but the
        email failed. Do not retry the registration — it will answer `409 account_exists`.
        Send the user to `POST /recover_password` instead.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, email, birthYear, captcha]
              properties:
                firstName:
                  type: string
                  description: First name of the user, or both first names when a couple shares the account.
                  example: Marie
                email:
                  type: string
                  format: email
                  description: Login address. The generated password is sent here. Must be unique.
                  example: marie@example.org
                birthYear:
                  type: integer
                  description: |-
                    Year of birth, used for anonymous statistics only. It does not need to be exact
                    (± 2 years is fine). Must be the current year or up to 100 years earlier.
                  example: 1994
                captcha:
                  type: string
                  description: The text read in the image from `GET /captcha`. Case-sensitive.
                  example: a7k2f
                method:
                  type: string
                  enum: [billings, fertilityCare]
                  default: billings
                  description: Tracking method. Defaults to `billings` when omitted. See introduction, section 7.
                temperatureTracking:
                  type: boolean
                  default: false
                  description: Does the user also record basal body temperature?
                discoveredComment:
                  type: string
                  description: Free-text answer to "how did you find this app?". Optional.
                  example: recommended by my midwife
                okForResearch:
                  type: boolean
                  default: false
                  description: Consent to share anonymous data with research programs.
      responses:
        "201":
          description: Account created. Check `welcomeEmailSent` before telling the user to look at their mailbox.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      userId:
                        type: integer
                        example: 42
                      email:
                        type: string
                        example: marie@example.org
                      name:
                        type: string
                        example: Marie
                      welcomeEmailSent:
                        type: boolean
                        description: "`false` means the account exists but the password email could not be sent."
        "400":
          description: "`missing_fields` | `invalid_email` | `invalid_birth_year`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: |-
            `registration_disabled` — this instance does not accept new accounts.
            `captcha_invalid` — wrong answer, no captcha stored, or the cookie was not sent back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: |-
            `already_authenticated` — you sent a valid token; log out first.
            `account_exists` — this email already has an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /captcha:
    get:
      tags: [account]
      summary: Get a captcha image
      description: |-
        Returns a **JPEG image**, not JSON. A human must read the text in it.

        The challenge is stored on the server against the `MONCYCLEAPP_TOKEN` cookie. The
        endpoint sets that cookie if you do not have one yet (valid 2 days), so your client
        must keep cookies for this flow to work.

        One image = one single use. The server erases the stored answer as soon as it is
        checked, right or wrong. Call this endpoint again for every new attempt.

        You need a captcha in two situations:

        - always, before `POST /register`;
        - before `POST /login`, once a response came back with `captchaRequired: true`
          (see introduction, section 9).

        The response carries `Cache-Control: no-store`, so each request is a fresh image.
      security: []
      responses:
        "200":
          description: A new captcha image. Also sets or refreshes the `MONCYCLEAPP_TOKEN` cookie.
          headers:
            Set-Cookie:
              description: "`MONCYCLEAPP_TOKEN=<random>`, sent only when the visitor has no valid cookie yet. HttpOnly, 2 days."
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary

  /login:
    post:
      tags: [account]
      summary: Log in and get a token
      description: |-
        Exchanges an email and a password for a **token**. The token is also set as the
        `MONCYCLEAPP_TOKEN` cookie, so a browser client does not need to store it.

        ### Which call do I make?

        ```
        POST /login {email, password}
          |
          |-- 200 + token ............... done
          |-- 401 totp_required ......... retry with {email, password, code}
          |-- 403 captcha_required ...... GET /captcha, then retry with {email, password, captcha}
          |-- 401 invalid_credentials ... wrong email or password
          |-- 403 account_locked ........ too many failures, wait (see section 9)
          |-- 429 rate_limited .......... too many attempts from this IP, wait
          '-- 200 alreadyAuthenticated .. you already sent a valid token
        ```

        A captcha and a TOTP code can both be required at the same time. Send them together.

        ### Reading the success body

        - `token` — your credential. **Absent** when `alreadyAuthenticated` is `true`, because
          no new token was created. Keep using the one you sent.
        - `alreadyAuthenticated: true` — you sent a valid token, so the server did nothing. The
          email and password in the body were not even checked.
        - `totpUsed` — whether a second factor was verified on this login.
        - `captchaRequired` — a hint about the **next** attempt on this account, not this one.
          It can appear on a success.

        Each successful login creates a **new** token and leaves the existing ones valid, so
        logging in on a phone does not disconnect the laptop.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: |-
            Authenticated. Three cases land here: password only, password + TOTP, or a request that
            already carried a valid token. Read `totpUsed` and `alreadyAuthenticated` to tell them
            apart.
          headers:
            Set-Cookie:
              description: "`MONCYCLEAPP_TOKEN=<token>`. HttpOnly, 5 years. Not sent when `alreadyAuthenticated` is true."
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: 256-character token. Absent when `alreadyAuthenticated` is `true`.
                      userId:
                        type: integer
                        example: 42
                      totpUsed:
                        type: boolean
                        description: "`true` when a TOTP code was verified. Absent when `alreadyAuthenticated` is `true`."
                      alreadyAuthenticated:
                        type: boolean
                        description: Present and `true` only when the request already carried a valid token.
                      captchaRequired:
                        type: boolean
                        description: Present and `true` when the **next** attempt on this account will need a captcha.
        "400":
          description: |-
            `missing_credentials` — `email` or `password` is absent, empty, or the email is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: |-
            `invalid_credentials` — wrong password, or no such account. The same code is used for both,
            on purpose, so nobody can discover which emails have an account.
            `totp_required` — the password is correct, now send `code`.
            `totp_invalid` — the password is correct but `code` is wrong or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: |-
            `login_disabled` — this instance has logins turned off.
            `captcha_required` — send `captcha` with the answer from `GET /captcha`.
            `account_disabled` — the account was deactivated by an administrator.
            `account_locked` — too many recent failures. Wait; it clears after 60 minutes with no new failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: "`rate_limited` — too many attempts from this IP address. Wait and try again later."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /logout:
    get:
      tags: [account]
      summary: Destroy the token you are using
      description: |-
        Deletes **the one token** used for this request, and clears the cookie.

        This endpoint answers with **`303` and a `Location` header**, not with JSON. The reason
        is that the web app calls it as a normal link (`<a href>`), and a browser needs a real
        redirect to navigate. If you call it with `fetch` or from a script, do not follow the
        redirect — just treat `303` as success.

        It is **idempotent**. Calling it without a token, or twice, also answers `303`.

        Other tokens of the same account stay valid. There is no "log out everywhere".
      responses:
        "303":
          description: Logged out. Also returned when you were not logged in. Redirects to `/auth`.
          headers:
            Location:
              description: Always `/auth`.
              schema:
                type: string
            Set-Cookie:
              description: Expires `MONCYCLEAPP_TOKEN` (and the legacy `MONCYCLEAPP_JETTON`).
              schema:
                type: string

  /password_change:
    post:
      tags: [account]
      summary: Change the password
      description: |-
        Changes the password of the account you are logged in as. You must know the current
        password, even though you are already authenticated.

        The new password must be **at least 8 characters** and must be different from the
        current one.

        Existing tokens are **not** revoked. The user stays logged in everywhere, including on
        any device a third party might hold. If that matters for your client, call
        `GET /logout` on the other sessions, or tell the user to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword:
                  type: string
                  description: The password in use right now.
                newPassword:
                  type: string
                  description: Minimum 8 characters. Must differ from the current one.
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      changed:
                        type: boolean
                        enum: [true]
        "400":
          description: "`missing_fields` — `oldPassword` or `newPassword` is absent or empty."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: |-
            `unauthorized` — no valid token.
            `invalid_password` — `oldPassword` is wrong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "422":
          description: |-
            `password_too_short` — fewer than 8 characters.
            `password_unchanged` — the new password is the same as the current one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /recover_password:
    post:
      tags: [account]
      summary: Send a new password by email
      description: |-
        Generates a new random password, replaces the old one, and emails it.

        **This endpoint always answers `200` with `sent: true`**, whether the account exists or
        not, and whether the email was delivered or not. It also waits a random 1 to 5 seconds.
        Both behaviours are deliberate: they stop an attacker from discovering which email
        addresses have an account, either from the response or from its timing.

        So your client cannot know whether a mail was really sent. Show a neutral message, for
        example: *"If an account exists for this address, a new password has been sent."*

        The old password stops working as soon as the account is found, so a user who triggers
        this by mistake must use the new password from the email.

        No captcha and no token are needed. Add your own throttling if you expose a public
        form.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: The login address of the account.
                  example: marie@example.org
      responses:
        "200":
          description: Request accepted. This says nothing about whether the account exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                        enum: [true]
        "400":
          description: |-
            `missing_email` — `email` is absent or empty.
            `invalid_email` — not a valid email address. Note: a *malformed* address is rejected,
            while a well-formed unknown address answers `200`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /totp:
    get:
      tags: [account]
      summary: "Two-factor: step 1, start the setup"
      description: |-
        Starts the setup of **TOTP** two-factor authentication (the 6-digit code from an app
        such as Aegis, FreeOTP or Google Authenticator).

        ### The three steps

        ```
        GET    /totp          -> a new secret + a QR code      (state becomes "init")
        POST   /totp {code}   -> confirm with one real code     (state becomes "active")
        DELETE /totp?code=... -> turn it off                    (state becomes "disabled")
        ```

        Two-factor is **not active** after this call. It only becomes active after `POST /totp`
        succeeds. Until then, login keeps working with the password alone. This way a user who
        loses the QR code mid-setup is never locked out.

        ### Using the response

        Show `qrcode` to the user, and `initSecret` as a fallback for manual entry. Each call
        generates a **new secret and replaces the previous one**, so any code from a half-
        finished earlier attempt stops working.

        | Field | Use |
        |---|---|
        | `qrcode` | A complete **SVG document as a string**. Render it directly; there is no PNG. |
        | `otpauth` | The `otpauth://` URI behind the QR code. Use it for a "tap to add" link on mobile. |
        | `initSecret` | The raw base32 secret, for users who type it by hand. |

        `initSecret` and `otpauth` are as sensitive as a password. Never log them.
      responses:
        "200":
          description: Setup started. The account state is now `init`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totpState:
                        type: string
                        enum: [init]
                      initSecret:
                        type: string
                        description: Base32 secret. Secret value — do not log it.
                        example: JBSWY3DPEHPK3PXP
                      otpauth:
                        type: string
                        description: "`otpauth://` provisioning URI. Secret value — do not log it."
                        example: otpauth://totp/marie%40example.org?issuer=MONCYCLE.APP&secret=JBSWY3DPEHPK3PXP
                      qrcode:
                        type: string
                        description: A full SVG document, as a string.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: "`totp_already_enabled` — turn it off with `DELETE /totp` before setting it up again."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    post:
      tags: [account]
      summary: "Two-factor: step 2, confirm and activate"
      description: |-
        Confirms the setup started by `GET /totp`, by checking one code produced from the new
        secret. **This is the call that actually turns two-factor on.**

        From now on, `POST /login` needs `code` in addition to the password.

        Call `GET /totp` first. Without a stored secret this call cannot succeed.

        A wrong code answers `401` and changes nothing, so the user can simply try again. Codes
        change every 30 seconds; a code that was correct a minute ago is no longer valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: integer
                  description: The 6-digit code shown by the authenticator app right now.
                  example: 492013
      responses:
        "200":
          description: Two-factor authentication is now active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totpState:
                        type: string
                        enum: [active]
        "400":
          description: "`totp_code_missing` — `code` is absent, empty, or not a positive number."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: |-
            `unauthorized` — no valid token.
            `totp_invalid` — the code does not match. Nothing was changed; the user can retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: "`totp_already_enabled` — it is already active; there is nothing to confirm."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    delete:
      tags: [account]
      summary: "Two-factor: turn it off"
      description: |-
        Turns two-factor authentication off and **erases the stored secret**. The state becomes
        `disabled`, not `never_used`, so you can still tell that the user once had it on.

        A **valid current code is required**, as a query parameter. This is on purpose: someone
        who steals a session cannot silently remove the second factor.

        There is no recovery path here. A user who lost their authenticator app cannot disable
        TOTP through the API and must contact support.
      parameters:
        - name: code
          in: query
          required: true
          description: The 6-digit code shown by the authenticator app right now.
          schema:
            type: integer
            example: 492013
      responses:
        "200":
          description: Two-factor authentication is off and the secret is erased.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totpState:
                        type: string
                        enum: [disabled]
        "400":
          description: "`totp_code_missing` — the `code` parameter is absent, empty, or not a positive number."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: |-
            `unauthorized` — no valid token.
            `totp_invalid` — the code does not match. Two-factor stays on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: "`totp_not_enabled` — two-factor was not active, so there is nothing to turn off."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /account:
    post:
      tags: [account]
      summary: Update account settings
      description: |-
        Updates the settings of the logged-in account.

        **Unlike `POST /day`, this is a partial update.** Only the fields present in the body
        are touched. Everything else keeps its value. Send a body with just the one setting you
        want to change.

        The response lists what really changed in `fieldsUpdated`. Use it to confirm: a field
        you sent but which does not appear there was **rejected or ignored**, and the call still
        answered `200`. There is no validation error for a bad value here.

        Things that surprise people:

        - `name` is ignored when it is an empty string.
        - `secondaryEmail` is ignored when it is not a valid address. Send `""` to remove it.
        - `birthYear` is ignored when it is `0` or negative.
        - `method` and `temperatureTracking` are stored together as one value. If you send only
          one of the two, **the other falls back to its default** (`billings`, and `false`).
          Always send both together. Both appear in `fieldsUpdated` under the single
          name `method`.
        - This endpoint cannot change the login email or the password. Use
          `POST /password_change` for the password.
      requestBody:
        required: true
        description: Every field is optional. An empty object `{}` is valid and changes nothing.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: First name, or both first names when a couple shares the account. An empty string is ignored.
                  example: Marie
                secondaryEmail:
                  type: string
                  description: A second address, to also receive charts by email. Send `""` to remove it.
                  example: partner@example.org
                method:
                  type: string
                  enum: [billings, fertilityCare]
                  description: Tracking method. **Always send `temperatureTracking` with it.**
                temperatureTracking:
                  type: boolean
                  description: Does the user also record basal temperature? **Always send `method` with it.**
                birthYear:
                  type: integer
                  description: Year of birth, for anonymous statistics. Ignored when `0` or negative.
                  example: 1994
                timelineAscending:
                  type: boolean
                  description: |-
                    Display preference only: `true` puts today at the top of the table. The API itself
                    always returns days in ascending date order, whatever this is set to.
                research:
                  type: boolean
                  description: Consent to contribute anonymous data to research programs.
                sponsor:
                  type: boolean
                  description: Marks the account as a financial supporter of the project.
                lastWriteClientUtc:
                  type: string
                  format: date-time
                  description: Your own clock, ISO 8601 UTC. The server uses its own clock if this is absent or invalid.
                  example: "2026-03-10T15:30:45Z"
      responses:
        "200":
          description: |-
            Request accepted. Read `fieldsUpdated` to see what really changed — it can be empty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The account name after the update.
                      fieldsUpdated:
                        type: array
                        description: Names of the settings that were really changed. Empty when nothing was.
                        items:
                          type: string
                          enum: [name, secondaryEmail, method, birthYear, timelineAscending, research, sponsor]
                        example: [method]
                      lastWriteClientUtc:
                        type: string
                        format: date-time
                        description: The timestamp that was stored, whether it came from you or from the server.
        "400":
          description: "`invalid_json` — the body is not a JSON object."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [account]
      summary: Delete the account for good
      description: |-
        Deletes the logged-in account **permanently**. There is no undo and no grace period.
        Days, descriptions, links and tokens all go with it, removed by database cascade.

        The current password must be sent **in the body**, as a confirmation. Note that this
        `DELETE` therefore carries a JSON body, which some HTTP clients do not send by default.

        Offer `GET /all_of_my_data_plz` to the user before calling this, so they can keep a copy
        of their data.

        After `204`, throw your token away: it no longer exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  description: The current account password, as a confirmation.
      responses:
        "204":
          description: Account deleted. No body. Your token is now invalid.
        "400":
          description: "`missing_password` | `invalid_json`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: |-
            `unauthorized` — no valid token.
            `invalid_password` — wrong password. Nothing was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ---------------------------------------------------------------------------
  # OBSERVATIONS
  # ---------------------------------------------------------------------------

  /key_infos:
    get:
      tags: [observations]
      summary: Account summary — call this first
      description: |-
        Everything a client needs at startup, in one call: who the user is, their settings, and
        the shape of their timeline.

        Call it right after login. `method` and `temperatureTracking` tell you **which fields of
        a day to show**, so you need them before you can draw anything.

        `allCyclesFirstDay` is the list of every day flagged `cycleFirstDay: true`, newest
        first. Together with `allPregnancyDates` it is enough to draw a cycle navigator without
        downloading the whole timeline.

        This endpoint is read-only and cheap. Nothing here is a secret: no password hash and no
        TOTP secret is ever returned.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/KeyInfos'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /day:
    get:
      tags: [observations]
      summary: Read days
      description: |-
        Reads days from the timeline. The result is **an object keyed by date**, so you can look
        a date up directly: `data["2026-03-10"]`.

        ### Three ways to ask

        | Parameters | What you get |
        |---|---|
        | none | **every** day stored on the account |
        | `date=2026-03-10,2026-03-11` | exactly those dates |
        | `start_date=...&end_date=...` | the days stored in that range, both ends **included** |

        You may combine `date` with a range. The results are merged into one object.

        ### Two behaviours worth knowing

        **1. `date` never returns "not found".** If you ask for a date with no data, you get a
        full day object with empty values instead of a `404`. A client can therefore render any
        date without a special case:

        ```json
        { "data": { "2026-03-15": { "date": "2026-03-15", "stampColor": null, "isPeak": false, "comment": "", "...": null } } }
        ```

        **2. A range only returns days that exist.** It does not pad the gaps. So `date` gives
        you one entry per date you asked for, while a 30-day range can come back with 4 entries.
        Fill the gaps in your client if your view needs a continuous month.

        ### One quirk to handle

        When there is **no matching data at all**, `data` is an empty **array** `[]` instead of
        an empty object `{}`:

        ```json
        { "data": [] }
        ```

        This comes from how PHP encodes an empty array as JSON. It is not a different shape to
        support — in a typed language, treat an empty array here as an empty map.

        Days always come back in **ascending date order**, whatever `timelineAscending` says in
        the account settings: that flag is only a display preference for the web app.
      parameters:
        - name: date
          in: query
          description: |-
            One or more dates `YYYY-MM-DD`, separated by commas. Spaces around them are allowed.
            Every date you list is returned, even when it holds no data.
          schema:
            type: string
            pattern: '^\s*\d{4}-\d{2}-\d{2}(\s*,\s*\d{4}-\d{2}-\d{2})*\s*$'
          example: "2026-03-10,2026-03-11"
        - name: start_date
          in: query
          description: First date of the range, included. **Must be used together with `end_date`.**
          schema:
            type: string
            format: date
            pattern: '^\s*\d{4}-\d{2}-\d{2}\s*$'
          example: "2026-03-01"
        - name: end_date
          in: query
          description: Last date of the range, included. **Must be used together with `start_date`.**
          schema:
            type: string
            format: date
            pattern: '^\s*\d{4}-\d{2}-\d{2}\s*$'
          example: "2026-03-31"
      responses:
        "200":
          description: |-
            An object keyed by date. Can be an empty array `[]` when nothing matched — see the
            description above.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Day'
        "400":
          description: |-
            `invalid_date` — a date does not match `YYYY-MM-DD`.
            `invalid_date_range` — you sent only one of `start_date` / `end_date`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [observations]
      summary: Write one day (replaces the whole day)
      description: |-
        Creates or replaces one day. The date in the body is the identifier — there is no id to
        pass and no separate "create" and "update" call.

        ### Read this before your first write

        **This is not a partial update.** The body must carry the *complete* state of the day.
        Any field you leave out is written as empty or `false`. There is no `PATCH`.

        ```
        correct:   GET the day -> change one field -> POST the whole object back
        wrong:     POST {"date": "...", "comment": "new"}      <- clears everything else
        ```

        The response body is the day as the server stored it, including the computed
        `cycleStartDate` and `cycleDay`. Use it to refresh your local copy — you do not need a
        second `GET`.

        ### Starting a cycle

        Send `cycleFirstDay: true`. That is the only thing needed. The server recomputes
        `cycleStartDate` and `cycleDay` for that day and for every later day, on every read.

        ### Free-text labels

        Names you put in `freeMucusSensation` and `freeMucusObservation` are resolved for you:
        an existing name is reused, a new name is created. You do not need `POST /description`
        first. Sending a name that exists under the other type links the existing label and
        keeps its original type.

        ### Values the server quietly ignores

        Validation here is minimal. Only the date is checked strictly. These cases are **not**
        errors — the value is simply dropped:

        | What you send | What is stored |
        |---|---|
        | `stampColor` outside Red / Green / Yellow / White | no colour |
        | `codifiedArrow` outside Up / Down / Right | `null` |
        | `temperature` of `0` or less | `null` |
        | `temperatureTime` without a valid `temperature` | `null` |
        | `counterStart` of `0` or less | `null` |

        So check your spelling: a typo in `stampColor` loses the stamp without telling you.
        Compare the response body with what you sent if you are unsure.

        ### Side effect

        Writing a day marks the account as active again. This matters because accounts with no
        activity for 4 years are deleted automatically.
      requestBody:
        required: true
        description: The **complete** day. `date` is required; everything else is optional but omitting it clears it.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Day'
            examples:
              billings:
                summary: Billings — first day of a cycle
                value:
                  date: "2026-03-10"
                  cycleFirstDay: true
                  stampColor: Red
                  freeMucusSensation: [dry]
                  comment: cramps in the morning
                  lastWriteClientUtc: "2026-03-10T07:12:00Z"
              billingsPeak:
                summary: Billings — peak day, with temperature
                value:
                  date: "2026-03-22"
                  stampColor: White
                  stampBaby: true
                  isPeak: true
                  counterStart: 3
                  freeMucusSensation: [slippery]
                  freeMucusObservation: [clear and stretchy]
                  temperature: 36.75
                  temperatureTime: "06:45:00"
                  sexUnion: true
              fertilityCare:
                summary: FertilityCare — codified day
                value:
                  date: "2026-03-22"
                  stampColor: White
                  stampBaby: true
                  isPeak: true
                  codifiedMucusSensation: "10"
                  codifiedMucusObservation: KL
                  codifiedNumberObservations: X2
                  codifiedArrow: Up
              notObserved:
                summary: A day the user did not observe
                value:
                  date: "2026-03-14"
                  dayNotObserved: true
      responses:
        "200":
          description: |-
            The day already existed and was replaced. You also get `200` for a date you deleted
            earlier, because `DELETE` keeps the row — see `DELETE /day`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Day'
        "201":
          description: A new day was created on the timeline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Day'
        "400":
          description: |-
            `invalid_json` — the body is not a JSON object.
            `invalid_date` — `date` is absent, malformed, or not a real calendar date (for example
            `2026-02-30`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "405":
          description: "`method_not_allowed` — only `GET`, `POST` and `DELETE` are supported on `/day`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    delete:
      tags: [observations]
      summary: Clear one day
      description: |-
        Clears the content of one day.

        ### It clears, it does not remove

        The day **stays on the timeline** as an empty day. This has three visible consequences:

        - the date still appears in `GET /day`, with all values empty;
        - a later `POST` on that date answers `200`, not `201`;
        - `GET /sync` reports it as a changed day, which is how other clients learn about the
          deletion.

        ### Two things it does not clear

        **Free-text labels survive.** `freeMucusSensation` and `freeMucusObservation` stay
        linked to the day. If you want a truly empty day, send a `POST` with only the date
        instead of calling `DELETE`:

        ```
        POST /day  {"date": "2026-03-10"}     <- clears everything, labels included
        DELETE /day?date=2026-03-10           <- clears the fields, keeps the labels
        ```

        **The cycle flag is cleared**, so deleting a day that started a cycle merges that cycle
        into the previous one. Every later day gets a new `cycleStartDate` and `cycleDay`. Check
        before deleting a day where `cycleFirstDay` is `true`.

        The call is idempotent, and a date that was never written is not an error.
      parameters:
        - name: date
          in: query
          required: true
          description: The date to clear, `YYYY-MM-DD`.
          schema:
            type: string
            format: date
            pattern: '^\s*\d{4}-\d{2}-\d{2}\s*$'
          example: "2026-03-10"
      responses:
        "204":
          description: Cleared. No body. Also returned for a date that held nothing.
        "400":
          description: "`invalid_date` — `date` is absent or does not match `YYYY-MM-DD`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /description:
    # NOTE: the path stays singular (not /descriptions) because the JS frontend calls this URL.
    # Renaming it would break the frontend, so it is left as is on purpose.
    get:
      tags: [observations]
      summary: List the free-text labels
      description: |-
        Lists every free-text label of the account, **most used first** (`useCount` descending).
        This order is meant to be used directly: show the list as it comes, and the labels the
        user picks most often are at the top.

        `useCount` is the number of days currently linked to the label. A label with
        `useCount: 0` is unused, and safe to delete.

        Labels are created for you by `POST /day`, so a client usually only reads this endpoint.
        Call it to fill a picklist, and after a rename or a delete to refresh the list.
      responses:
        "200":
          description: OK. An empty array when the account has no labels yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Description'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [observations]
      summary: Create or rename a free-text label
      description: |-
        One call does two jobs:

        - **no `id`** → create a new label;
        - **with `id`** → rename that label, or change its type.

        A rename applies **everywhere at once**. Every day linked to the label shows the new
        name immediately, because days point at the label by id, not by name.

        You rarely need this to create a label: `POST /day` already creates any unknown name you
        send. Use this endpoint for the "manage my labels" screen.

        Names are **unique per account** and **case-sensitive**. `"Dry"` and `"dry"` can both
        exist. A name already in use answers `409`.

        Note that the response does **not** contain `useCount`. Call `GET /description` when you
        need the counts again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  maxLength: 256
                  description: The label text. Unique per account, case-sensitive. Leading and trailing spaces are removed.
                  example: clear and stretchy
                type:
                  type: string
                  enum: [undefined, observation, sensation]
                  description: "`sensation` = what the user feels. `observation` = what the user sees."
                id:
                  type: integer
                  description: The label to rename or retype. Omit it to create a new label.
                  example: 58
                lastWriteClientUtc:
                  type: string
                  format: date-time
                  description: Your own clock, ISO 8601 UTC. The server uses its own clock if this is absent or invalid.
                  example: "2026-03-10T15:30:45Z"
      responses:
        "200":
          description: The existing label was renamed or retyped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DescriptionWritten'
        "201":
          description: A new label was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DescriptionWritten'
        "400":
          description: |-
            `missing_fields` — `name` or `type` is absent or empty.
            `invalid_id` — `id` is not an integer.
            `invalid_type` — `type` is not one of the three allowed values.
            `invalid_json` — the body is not a JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: "`not_found` — no label with this `id` on your account."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: "`duplicate_name` — another label of this account already has this exact name."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    delete:
      tags: [observations]
      summary: Delete a free-text label
      description: |-
        Deletes a label **permanently, and unlinks it from every day at once**.

        This is a real delete, not a clear. It is the one destructive operation in this group,
        so check `useCount` from `GET /description` first and warn the user when it is not `0`.
        The days themselves are kept; only the label disappears from them.

        **Other clients cannot detect this through `GET /sync`.** A deleted label leaves no
        trace there (see introduction, section 8). After a delete, refresh with a full
        `GET /description`.
      parameters:
        - name: id
          in: query
          required: true
          description: The label to delete.
          schema:
            type: integer
          example: 58
      responses:
        "204":
          description: Deleted. No body.
        "400":
          description: |-
            `missing_id` — the `id` parameter is absent or empty.
            `invalid_id` — `id` is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: "`not_found` — no label with this `id` on your account."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /sync:
    get:
      tags: [observations]
      summary: What changed since a given time?
      description: |-
        Returns every day and every label whose `lastWriteClientUtc` is **greater than or equal
        to** `fromTimestamp`. This is how two clients of the same account stay consistent
        without downloading the whole timeline.

        Read **section 8** of the introduction for the loop and for the three limits. In short:

        - the filter uses the **client** clock, so subtract a safety margin from your last sync
          time, and make your merge idempotent;
        - the bound is **inclusive**, so the last record comes back again next time;
        - a deleted **day** appears as a blanked day, but a deleted **label** leaves no trace.

        The two lists are independent. Both can be empty, which simply means "nothing changed".
        A first full download is `fromTimestamp=1970-01-01T00:00:00Z`.

        Days returned here carry the same computed `cycleStartDate` and `cycleDay` as in
        `GET /day`. Labels carry `useCount`.
      parameters:
        - name: fromTimestamp
          in: query
          required: true
          description: |-
            A UTC timestamp. Both ISO 8601 (`2026-03-10T15:30:45Z`) and the bare form
            (`2026-03-10 15:30:45`) are accepted. Any timezone offset you send is ignored, and the
            value is read as UTC.
          schema:
            type: string
            format: date-time
          example: "2026-03-10T15:30:45Z"
      responses:
        "200":
          description: OK. Either list can be empty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      days:
                        type: array
                        description: Changed days, as a flat array — not keyed by date like `GET /day`.
                        items:
                          $ref: '#/components/schemas/Day'
                      descriptions:
                        type: array
                        description: Changed labels. Deleted labels are **not** listed.
                        items:
                          $ref: '#/components/schemas/Description'
        "400":
          description: |-
            `missing_parameter` — `fromTimestamp` was not sent.
            `invalid_timestamp` — it is not a valid UTC timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # FILES
  # ---------------------------------------------------------------------------

  /export:
    get:
      tags: [files]
      summary: Export a period as NFP, CSV or PDF
      description: |-
        Downloads a period of the timeline as a file. Three formats, three purposes:

        | `type` | Content type | Purpose |
        |---|---|---|
        | `nfp` | `application/json` | **Portable data.** The NFP file format, to move data to another app, and what `POST /import` reads. See the `NfpFile` schema. |
        | `csv` | `application/csv` | A spreadsheet, for a quick look at raw values. |
        | `pdf` | `application/pdf` | A printable chart, laid out for the account's method. |

        ### Reading errors from this endpoint

        This endpoint is older than the JSON API. **It does not use the `error` envelope.**
        Failures answer a plain-text message, in French, with content type `text/html`. So test
        the HTTP status, not the body.

        Unauthenticated requests answer `401` with **no body** and a `Location: auth` header.

        ### Rules on the parameters

        - `start_date` must be **strictly before** `end_date`. Equal dates are rejected. So you
          cannot export a single day.
        - The period must contain at least one recorded day, otherwise you get `400`.
        - For `type=nfp` the export is widened backwards to the **first day of the cycle**
          containing `start_date`, so a cycle is never exported cut in half. The `csv` and `pdf`
          formats use exactly the dates you asked for.
        - `anonymous=1` affects `pdf` and `nfp`: it leaves the user's name off the chart, and
          omits the `userInformation` block from the NFP file. The observations themselves are
          unchanged. This is what you want before sharing either with a practitioner.
        - `json_in_page=1` only affects `nfp`: it returns indented JSON inline instead of
          triggering a file download. Useful for a quick look in a browser or in curl.

        ### What an NFP export contains

        `fileInformation` (this app and its version), `userMethodPreferences.preferredMethod`,
        `userInformation` unless `anonymous=1`, and the cycles of the period — split at each
        cycle first day, each one a full run of dates with gaps written as `{}`.

        Re-importing an exported file reproduces the account exactly, with three expected
        normalisations of the FertilityCare notation: `Br` is written `B`, `x1`/`x2`/`x3` are
        written uppercase, and `C/K` is written `CK`.

        By default the response carries `Content-Disposition: attachment`, so a browser saves a
        file named `moncycle_app_<date>.<ext>`.
      parameters:
        - name: type
          in: query
          required: true
          description: The file format.
          schema:
            type: string
            enum: [nfp, csv, pdf]
        - name: start_date
          in: query
          required: true
          description: First date, `YYYY-MM-DD`. Must be **strictly before** `end_date`.
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2026-03-01"
        - name: end_date
          in: query
          required: true
          description: Last date, `YYYY-MM-DD`.
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: "2026-03-31"
        - name: json_in_page
          in: query
          required: false
          description: "`type=nfp` only. `1` = return indented JSON inline. `0` = download a `.nfp` file."
          schema:
            type: integer
            enum: [0, 1]
            default: 0
        - name: anonymous
          in: query
          required: false
          description: |-
            `type=pdf` and `type=nfp`. `1` = leave the user's name off the chart, and omit
            `userInformation` from the NFP file.
          schema:
            type: integer
            enum: [0, 1]
            default: 0
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"moncycle_app_<date>.<ext>\"`. Absent when `json_in_page=1`."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NfpFile'
            application/csv:
              schema:
                type: string
                description: One header row, then one row per day.
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: |-
            A plain-text message in French, **not** the `error` envelope. Causes: a missing or
            malformed date; `start_date` not before `end_date`; a `type` outside the three values;
            `anonymous` or `json_in_page` outside `0` / `1`; or no recorded day in the period.

            Note that `anonymous` is now validated for every `type`, not only `pdf`.
          content:
            text/html:
              schema:
                type: string
                example: "ERREUR: la 'start_date' doit être antérieure à la 'end_date'."
        "401":
          description: "Not authenticated. No body, and a `Location: auth` header."

  /import:
    post:
      tags: [files]
      summary: Import an NFP file into the account
      description: |-
        Reads an NFP file and writes its cycles into the logged-in account.

        > **Changed in 15.** This endpoint used to validate only, answer `{"import": "ok"}` and
        > report failures in its own `err_code` / `err_message` / `err_list` shape. It now
        > writes, answers an `ImportReport` inside the standard `data` envelope, and reports
        > failures with the standard `error` envelope. `dryRun=1` reproduces the old
        > check-only behaviour, and `overide` now does something.

        ### All or nothing

        The file goes through four stages, and **nothing is written until every checking stage
        has passed**:

        | Stage | What it checks | Failure |
        |---|---|---|
        | 1 | size, UTF-8, JSON, nesting depth, `schemaVersion` | `413`, or `400` |
        | 2 | structure and types, against `NfpFile` | `400` `invalid_nfp_structure` |
        | 3 | real calendar dates, value ranges, text lengths, overlapping cycles | `400` `inconsistent_nfp_data` |
        | 4 | the write, inside one transaction | `500`, nothing committed |

        So a rejected file leaves the account exactly as it was, and an accepted file is
        imported whole.

        ### Days that already have data

        `overide=0` (the default) leaves those dates untouched and lists them in `daysSkipped`.
        `overide=1` replaces them whole — including their free-text labels — exactly like a
        `POST /day`, which also carries the full state of a day.

        A day the file leaves empty (`{}`) is a gap: it is not written, and it does not count as
        a conflict. The **first** day of each cycle is always written even when empty, because
        it is what marks the cycle boundary.

        ### Nothing is dropped silently

        This app does not record everything the format can describe, so every answer reports
        what became of the rest — see `ImportReport`:

        - `ignoredFields` — carried by the file, nowhere to put it here (cervix observations,
          `codifiedEvents`, `babyFeedCount`, `codifiedManualFertility`, ...).
        - `mappedFields` — stored, but less precisely than the file said (a `symptothermic_fr`
          bleeding value becomes a Red stamp; `sexUnion: "ReservedUnion"` becomes a plain
          union).
        - `warnings` — accepted, but worth showing the user: usually a cycle whose `method`
          differs from the account's.

        A cycle of **any** `method` imports, `symptothermic_fr` included: the fields every
        method shares are kept, and the rest is reported.

        ### What an import never changes

        `userInformation` and `userMethodPreferences` are read but **never applied**. A file
        cannot rename the account, change its address, or switch its method — that is what
        `POST /account` is for. Both appear in `ignoredFields`.

        ### Limits

        Rejected with `400` (or `413` for the first): **256 KB** per request (the server's
        `post_max_size`; raising it means raising `memory_limit` too), 120 cycles per file,
        400 days per cycle, 4000 days per file, 20 free-text labels per day, 256 characters per
        label and per joined comment, temperature between 30 and 45 °C.

        Dates must be real calendar dates, no earlier than `1900-01-01`, and not in the future
        (one day of slack, for a client in a timezone ahead of the server). Two cycles covering
        the same date reject the file, since the day would belong to both.
      parameters:
        - name: overide
          in: query
          required: false
          description: |-
            `0` leaves dates that already have data alone and reports them in `daysSkipped`.
            `1` replaces them. (The spelling is kept for compatibility.)
          schema:
            type: integer
            enum: [0, 1]
            default: 0
        - name: dryRun
          in: query
          required: false
          description: |-
            `1` runs every check and answers the same report with `daysToWrite` filled in,
            **without writing anything**. Use it for a "check my file first" step.
          schema:
            type: integer
            enum: [0, 1]
            default: 0
        - name: lastWriteClientUtc
          in: query
          required: false
          description: |-
            The client's UTC clock, ISO 8601, recorded on every day the import writes so
            `GET /sync` can order it against other devices. Defaults to the server's time.
          schema:
            type: string
            format: date-time
          example: "2026-03-31T18:04:22Z"
      requestBody:
        required: true
        description: The content of an `.nfp` file, as a JSON body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NfpFile'
      responses:
        "200":
          description: |-
            The file was accepted. On a dry run nothing was written; otherwise the days in
            `daysCreated` and `daysOverwritten` are now in the account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ImportReport'
        "400":
          description: |-
            The file was rejected and **nothing was written**. `error.code` says which stage
            refused it:

            | `code` | Meaning |
            |---|---|
            | `invalid_parameter` | `overide` or `dryRun` is not `0`/`1` |
            | `empty_body` | no request body |
            | `invalid_encoding` | the body is not valid UTF-8 |
            | `invalid_json` | not JSON, too deeply nested, or the top level is not an object |
            | `missing_schema_version` | `schemaVersion` absent or empty |
            | `invalid_schema_version` | `schemaVersion` is not a number like `1.0` |
            | `unsupported_schema_version` | a version this build does not implement |
            | `invalid_nfp_structure` | fails the `NfpFile` schema |
            | `inconsistent_nfp_data` | valid JSON, impossible contents |

            `invalid_nfp_structure` and `inconsistent_nfp_data` carry `error.details.issues`:
            one line per problem, `[where] what is wrong`, with `where` a path inside the file
            (`cycles[0].days[7].temperature`) or the date of the day. Capped at 50 lines, with
            `error.details.issueCount` giving the true total. Built to be shown as is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: inconsistent_nfp_data
                  message: The file is valid JSON but its contents are inconsistent.
                  details:
                    issues:
                      - "[2026-03-14] temperature 52.4 is outside the plausible range 30.0-45.0 C."
                      - "[cycles[1]] 2026-03-20 appears twice in the file (also in cycles[0]): the cycles overlap."
                    issueCount: 2
        "401":
          $ref: '#/components/responses/Unauthorized'
        "405":
          description: "`method_not_allowed` — only `POST`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "413":
          description: |-
            `file_too_large` — the body is over the server's `post_max_size`, so it never
            reached the application. Split the file into fewer cycles. The message quotes the
            size and the limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /all_of_my_data_plz:
    get:
      tags: [files]
      summary: Download everything (GDPR)
      description: |-
        Returns **all** data held about the logged-in account, as one CSV file. This covers the
        GDPR right of access, and it is also the right thing to offer a user before
        `DELETE /account`.

        The file is not a clean table. It is three blocks, one after another, each with its own
        header row:

        1. the account record;
        2. the authentication tokens (one row per device);
        3. every recorded day.

        Columns are the **internal database column names**, in French in places, and the
        separator is `;` by default. The file starts with a UTF-8 BOM so that Excel opens
        accented characters correctly.

        Secrets are masked, not exported: the password hash, the TOTP secret and the token
        strings appear as `abc [masqué] xyz`.

        This is a human-readable dump for the user, not a machine format. To move data to
        another app, use `GET /export?type=nfp`.
      responses:
        "200":
          description: The CSV file.
          headers:
            Content-Disposition:
              description: '`attachment; filename="export_moncycle_app.csv"`'
              schema:
                type: string
          content:
            application/csv:
              schema:
                type: string
                format: binary
        "401":
          description: "Not authenticated. No body, and a `Location: auth` header."

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  responses:

    Unauthorized:
      description: |-
        `unauthorized` — no token, an unknown token, or the account is deactivated. Send the user
        back to `POST /login`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: unauthorized
              message: Authentication required.

  schemas:

    Error:
      type: object
      description: The content of the `error` key. See introduction, section 2.
      required: [code, message]
      properties:
        code:
          type: string
          description: |-
            A stable slug, meant for your program. It does not change, so you can branch on it
            safely. Each endpoint lists the codes it can return.

            Codes you may meet anywhere: `unauthorized` (no valid token), `invalid_json` (the body
            is not a JSON object), `unexpected_error` (a server fault — retry, then report it).
          example: invalid_credentials
        message:
          type: string
          description: |-
            A sentence in English for a human. Log it, or show it. **Never parse it** — the wording
            can change at any release.
          example: Incorrect password or non-existent account.
        details:
          type: object
          description: |-
            Optional extra context. For example `/login` adds `captchaRequired: true`, and
            `/register` adds `userId` on `already_authenticated`.
          additionalProperties: true

    ErrorEnvelope:
      type: object
      description: Every failure of a JSON endpoint looks like this.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: The login address of the account.
          example: demo.bill@moncycle.app
        password:
          type: string
          format: password
          description: The account password.
          example: demo
        code:
          type: integer
          description: |-
            The 6-digit TOTP code. Required only once a login answered `401 totp_required` — that
            is, only for accounts where two-factor is active.
          example: 492013
        captcha:
          type: string
          description: |-
            The answer to the image from `GET /captcha`. Required only once a login answered
            `403 captcha_required`, or once a response carried `captchaRequired: true`. The same
            cookie must be sent with both calls.
          example: a7k2f

    KeyInfos:
      type: object
      description: The account summary returned by `GET /key_infos`.
      properties:
        userId:
          type: integer
          example: 42
        email:
          type: string
          format: email
          description: The login address.
        secondaryEmail:
          type: string
          nullable: true
          description: An optional second address, used to also receive charts by email.
        method:
          type: string
          enum: [billings, fertilityCare]
          description: The tracking method. It decides which fields of a day to display.
        temperatureTracking:
          type: boolean
          description: Does the user also record basal body temperature?
        birthYear:
          type: integer
          description: Year of birth, approximate, used for anonymous statistics.
          example: 1994
        name:
          type: string
          description: First name, or both first names when a couple shares the account.
          example: Marie
        inscriptionDate:
          type: string
          format: date-time
          description: When the account was created, UTC.
          example: "2024-06-14T09:21:03Z"
        sponsor:
          type: boolean
          description: Is this account a financial supporter of the project?
        research:
          type: boolean
          description: Has the user agreed to contribute anonymous data to research?
        timelineAscending:
          type: boolean
          description: |-
            Display preference: `true` puts today at the top of the table. The API itself always
            returns days in ascending date order.
        allCyclesFirstDay:
          type: array
          description: |-
            Every date flagged `cycleFirstDay: true`, **newest first**. Enough to draw a cycle
            navigator without downloading the timeline.
          items:
            type: string
            format: date
          example: ["2026-03-10", "2026-02-11", "2026-01-14"]
        allPregnancyDates:
          type: array
          description: "Every date flagged `booleanPregnancyDetected: true`, newest first."
          items:
            type: string
            format: date
        totpState:
          type: string
          enum: [never_used, disabled, init, active, unknown]
          description: |-
            Where the account stands with two-factor authentication.

            | Value | Meaning |
            |---|---|
            | `active` | On. `POST /login` needs a `code`. |
            | `init` | `GET /totp` was called but never confirmed. Login still works with the password alone. |
            | `disabled` | It was on, and the user turned it off. |
            | `never_used` | Never set up. |
            | `unknown` | No state stored. A brand-new account reports this; treat it exactly like `never_used`. |
        lastWriteClientUtc:
          type: string
          format: date-time
          nullable: true
          description: When the account settings were last written, from the client clock. `null` if never.

    Day:
      type: object
      description: |-
        One day of the timeline — the central object of this API. Used by `GET /day`,
        `POST /day` and `GET /sync`.

        **On write, send the whole object.** Any field you leave out is cleared. See
        `POST /day`.

        Three groups of fields:

        - **read-only**, computed by the server: `cycleStartDate`, `cycleDay`, `lastWriteDb`;
        - **common** to both methods: the stamp, `isPeak`, `cycleFirstDay`, `sexUnion`,
          `temperature`, `comment`…;
        - **method-specific**: `freeMucus*` for Billings, `codified*` for FertilityCare.

        Sending a field from the other method is not an error, but the app will not display it.
      required: [date]
      properties:

        date:
          type: string
          format: date
          description: |-
            `YYYY-MM-DD`. This is the identifier of the day. **Required on write**; ignored in the
            body on read. Must be a real calendar date.
          example: "2026-03-10"

        cycleStartDate:
          type: string
          format: date
          nullable: true
          description: |-
            **Read-only, computed.** The first day of the cycle this date belongs to: the closest
            day at or before it with `cycleFirstDay: true`. `null` when no cycle has started yet.
          example: "2026-03-10"
        cycleDay:
          type: integer
          nullable: true
          description: |-
            **Read-only, computed.** Position of this date inside its cycle, starting at `1`.
            `null` when `cycleStartDate` is `null`.
          example: 1

        cycleFirstDay:
          type: boolean
          default: false
          description: |-
            `true` marks this date as **day 1 of a new cycle**. This single flag is how cycles exist
            in this API — see introduction, section 1. Setting it back to `false` merges the cycle
            into the previous one.
        dayNotObserved:
          type: boolean
          default: false
          description: |-
            The user explicitly recorded **no observation** for this date. Different from a date
            with no data at all: this one says "I looked and I have nothing to note".

        stampColor:
          type: string
          nullable: true
          enum: [Red, Green, Yellow, White]
          description: |-
            The colour of the stamp on the chart. An unknown value is silently dropped.

            Known limit: `"White"` together with `stampBaby: false` cannot be stored. Both "white
            stamp" and "no stamp" use the same empty code in the database, and both read back as
            `null`. This app has never had a distinct code for a plain colourless stamp.
        stampBaby:
          type: boolean
          default: false
          description: A baby picture on top of the stamp, marking a potentially fertile day.

        isPeak:
          type: boolean
          default: false
          description: |-
            Peak day: the last day with the most fertile type of mucus. A cycle **can** have more
            than one, so do not assume it is unique.
        counterStart:
          type: integer
          nullable: true
          description: |-
            Start a visible counter on this day and show it for this many days. A value of `0` or
            less is stored as `null`. Keep it small — the stored range is 0 to 255.
          example: 3

        sexUnion:
          type: boolean
          default: false
          description: Sexual intercourse on this date.
        booleanPregnancyDetected:
          type: boolean
          default: false
          description: A pregnancy was detected on this date. These dates are also listed in `GET /key_infos`.

        freeMucusSensation:
          type: array
          description: |-
            **Billings only.** What the user *feels*, as free-text labels, for example `["dry"]`.

            A name that does not exist yet is created for you. A name that already exists under
            `freeMucusObservation` is reused and keeps its original type — names are unique per
            account whatever their type. Names are case-sensitive.

            In the NFP **file** format these labels are an array too. Files written by
            moncycle.app 14 held one comma-joined string instead; `POST /import` still reads
            those.
          items:
            type: string
            maxLength: 256
          example: [dry, slippery]
        freeMucusObservation:
          type: array
          description: "**Billings only.** What the user *sees*, as free-text labels. Same rules as `freeMucusSensation`."
          items:
            type: string
            maxLength: 256
          example: [clear and stretchy]

        temperature:
          type: number
          format: float
          nullable: true
          description: |-
            Basal body temperature. A value of `0` or less is stored as `null`. Stored with 2
            decimals, so the range is 0.00 to 99.99 — the unit is whatever the user records,
            usually °C.
          example: 36.75
        temperatureTime:
          type: string
          nullable: true
          description: |-
            When the temperature was taken, `hh:mm:ss`. **Ignored unless a valid `temperature` is
            sent in the same request.**
          example: "06:45:00"

        codifiedBleedingObservation:
          type: string
          nullable: true
          description: |-
            **FertilityCare only.** One of `VH`, `H`, `M`, `VL`, `B`, with an optional `L` suffix for
            spotting (for example `BL`), or `L` alone for spotting only.
          example: BL
        codifiedMucusSensation:
          type: string
          nullable: true
          description: "**FertilityCare only.** One of `0`, `2`, `2W`, `4`, `6`, `8`, `10`, `10DL`, `10SL`, `10WL`."
          example: "10"
        codifiedMucusObservation:
          type: string
          nullable: true
          description: "**FertilityCare only.** Any combination of `C`, `G`, `K`, `P`, `Y`, `L`."
          example: KL
        codifiedNumberObservations:
          type: string
          nullable: true
          description: "**FertilityCare only.** One of `X1`, `X2`, `X3`, `AD`."
          example: X2
        codifiedPainObservations:
          type: string
          nullable: true
          description: "**FertilityCare only.** One of `AP`, `RAP`, `LAP`."
          example: AP
        codifiedArrow:
          type: string
          nullable: true
          enum: [Up, Down, Right]
          description: "**FertilityCare only.** The arrow drawn on the chart. An unknown value is stored as `null`."

        comment:
          type: string
          maxLength: 256
          default: ""
          description: A free note from the user. Read back as `""` when empty, never `null`.
          example: cramps in the morning

        lastWriteClientUtc:
          type: string
          format: date-time
          nullable: true
          description: |-
            Your own clock, ISO 8601 UTC. The server uses its own clock if this is absent or
            invalid. **This is the field `GET /sync` filters on** — see introduction, section 8.
          example: "2026-03-10T07:12:00Z"
        lastWriteDb:
          type: string
          format: date-time
          nullable: true
          description: "**Read-only.** The server clock at the last write."
          example: "2026-03-10T07:12:03Z"

    Description:
      type: object
      description: A reusable free-text label, as returned by `GET /description` and `GET /sync`.
      properties:
        id:
          type: integer
          description: The identifier. Days point at the label by this id, so a rename applies everywhere.
          example: 58
        name:
          type: string
          maxLength: 256
          description: The label text. Unique per account, case-sensitive.
          example: clear and stretchy
        type:
          type: string
          enum: [undefined, observation, sensation]
          description: |-
            `sensation` = what the user feels. `observation` = what the user sees. `undefined` =
            neither was recorded.
        useCount:
          type: integer
          description: How many days are linked to this label right now. `0` means unused, so safe to delete.
          example: 12

    DescriptionWritten:
      type: object
      description: |-
        What `POST /description` returns. It is the same label as `Description`, but with
        `lastWriteClientUtc` instead of `useCount`. Call `GET /description` when you need the
        counts.
      properties:
        id:
          type: integer
          example: 58
        name:
          type: string
          description: The stored name, with leading and trailing spaces removed.
          example: clear and stretchy
        type:
          type: string
          enum: [undefined, observation, sensation]
        lastWriteClientUtc:
          type: string
          format: date-time
          description: The timestamp that was stored, whether it came from you or from the server.
          example: "2026-03-10T15:30:45Z"

    NfpFile:
      type: object
      description: |-
        The **NFP file format**: a portable JSON file for moving cycle data between NFP apps.
        Produced by `GET /export?type=nfp`, read and written by `POST /import`.

        It is not the live API shape, and it carries its own version number, independent of the
        app version. Only `schemaVersion` `"1.0"` is supported.

        ### Reading older files

        Three variants of version 1.0 are in circulation. `POST /import` accepts all three;
        `GET /export` always writes the first.

        | | current | early draft | moncycle.app 14 |
        |---|---|---|---|
        | writing app | `fileInformation` object | flat `source_app`, `source_app_version`, `file_creation_timestamp` | as the draft |
        | user block | `userInformation` object | positional array `[id, email, firstName, lastName, birthDate]` | as the draft |
        | preferred method | `preferredMethod` | `preferedMethod` (one `r`) | `preferedMethod` |
        | day note | `comments` array | `comment` string | `comment` string |
        | empty day | `mucusNotObserved` | `dayNotObserved` | `dayNotObserved` |
        | free-text labels | arrays | arrays | **comma-joined strings** |
        | `sexUnion` | enum string | enum string | **boolean** |
        | flags | real booleans | strings `"true"`/`"false"` | real booleans |

        Older spellings are normalised on the way in, so they never reach the live API.
      required: [schemaVersion, fileInformation, cycles]
      properties:
        schemaVersion:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
          description: Version of this file format. Must be `"1.0"`.
          example: "1.0"
        fileInformation:
          $ref: '#/components/schemas/NfpFileInformation'
        userInformation:
          $ref: '#/components/schemas/NfpUserInformation'
        userMethodPreferences:
          $ref: '#/components/schemas/NfpUserMethodPreferences'
        cycles:
          type: array
          minItems: 1
          maxItems: 120
          description: The cycles, in order.
          items:
            $ref: '#/components/schemas/NfpCycle'

    NfpFileInformation:
      type: object
      description: Which app wrote the file, and when.
      required: [sourceApp, sourceAppVersion, fileCreationTimestamp]
      properties:
        sourceApp:
          type: string
          maxLength: 255
          description: The app that wrote the file.
          example: moncycle.app
        sourceAppVersion:
          type: string
          maxLength: 64
          description: The version of that app.
          example: "15dev"
        fileCreationTimestamp:
          type: string
          maxLength: 64
          description: |-
            When the file was written, ISO 8601 with a timezone. A bare `YYYY-MM-DD hh:mm:ss`
            (what the early draft used) is also accepted and converted.
          example: "2026-03-31T18:04:22+02:00"

    NfpUserInformation:
      type: object
      description: |-
        Who the data belongs to. Every field is optional.

        **On import this block is read but never applied**: a file cannot rename the account,
        change its address or alter its identity. It is reported in `ignoredFields`.

        On export it is omitted entirely when `anonymous=1`.
      properties:
        identifier:
          type: string
          maxLength: 255
          description: The writing app's own id for the user. moncycle.app writes the account id.
          example: "1042"
        email:
          type: string
          maxLength: 255
          example: jane@example.org
        firstName:
          type: string
          maxLength: 255
          example: Jane
        lastName:
          type: string
          maxLength: 255
        birthDate:
          type: string
          maxLength: 32
          description: |-
            `YYYY-MM-DD`. moncycle.app never writes this field: it only stores a birth *year*
            (`birthYear` on `/account`), and a full date would mean inventing a day and month.
          example: "1995-12-31"
        comment:
          type: string
          maxLength: 1024

    NfpUserMethodPreferences:
      type: object
      description: |-
        The user's method settings. Advisory: it has no effect on whether a file is valid, and
        the per-cycle `method` is what decides how a cycle is read.

        **On import this block is read but never applied** — the account's method is only
        changed from `POST /account`. It is reported in `ignoredFields`.
      properties:
        preferredMethod:
          type: string
          maxLength: 64
          description: "`billings`, `fertilityCare`, `symptothermic_fr`, or another app's own value."
          example: billings
        twoTenthShift:
          type: boolean
          description: Not recorded by this app.
        oestrogenicalHollow:
          type: boolean
          description: Not recorded by this app.
        irregularitiesSensibility:
          type: boolean
          description: Not recorded by this app.

    NfpCycle:
      type: object
      description: |-
        One cycle. Unlike the live API, the file records the `method` **per cycle**, so a user
        who changed method keeps a correct history.
      required: [method, cycleStartDate, days]
      properties:
        method:
          type: string
          maxLength: 64
          description: |-
            The method used for this cycle: `billings`, `fertilityCare` or `symptothermic_fr`
            (case-insensitive), or an app's own value.

            This app records `billings` and `fertilityCare`. A cycle of any other method still
            imports — the fields every method shares are kept, and the rest is reported in
            `ignoredFields`.
          example: billings
        cycleStartDate:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Day 1 of this cycle. The first entry in `days` is this date.
          example: "2026-03-10"
        days:
          type: array
          maxItems: 400
          description: |-
            The days of the cycle in date order, starting at `cycleStartDate`, so the position
            in the array is the day number. A day with nothing recorded is an empty object
            (`{}`) rather than being left out.

            On import an empty day is a gap: it is not written, and it is not treated as a
            conflict with existing data. The **first** day of a cycle is always written even
            when empty, because it carries the cycle boundary.
          items:
            $ref: '#/components/schemas/NfpFileDay'
        comment:
          type: string
          maxLength: 1024
          description: Not recorded by this app — only per-day comments are. Reported on import.
        cycleParticularCases:
          type: array
          maxItems: 8
          description: Not recorded by this app. Reported on import.
          items:
            type: string
            enum: [FirstEyedCycle, PostPill, Pregnancy, PostPartum]
        currentCyclePlannedPregnancy:
          type: string
          enum: [Yes, No, Undecided]
          description: Not recorded by this app. Reported on import.
        nextMonthsPlannedPregnancy:
          type: string
          enum: [Yes, No, Undecided]
          description: Not recorded by this app. Reported on import.
        endOfCycleFollowUp:
          type: string
          enum: [Pregnancy, Menopause, Disease, Other]
          description: Not recorded by this app. Reported on import.
        temperatureUsualTime:
          type: string
          pattern: '^\d{2}:\d{2}:\d{2}$'
          description: Not recorded by this app. Reported on import.
        temperatureCaptureType:
          type: string
          maxLength: 64
          description: Not recorded by this app. Reported on import.
        temperatureThermometerType:
          type: string
          maxLength: 64
          description: Not recorded by this app. Reported on import.

    NfpFileDay:
      type: object
      description: |-
        One day. **Every field is optional**, and a field with no value is left out entirely
        rather than set to `null` — so `{}` is a day with nothing recorded.

        Flags are real booleans and free-text labels are real arrays (the early draft typed
        them as strings; those are still accepted on import).

        ### What this app stores

        Fields marked *not stored* are read, counted and reported in `ignoredFields`, never
        written. Fields marked *narrowed* are written as something less precise, and reported
        in `mappedFields`.
      properties:
        comments:
          type: array
          maxItems: 32
          description: |-
            The user's free notes. Joined with newlines into the single `comment` of the live
            `Day`, which holds **256 characters** — a longer result rejects the file.
          items:
            type: string
            maxLength: 256
          example: ["cramps in the morning"]
        stampColor:
          type: string
          enum: [Green, Red, Yellow, White]
          description: |-
            *Narrowed for `White` alone.* The stamp is stored as a colour plus an optional baby
            label, and white is the absence of a colour — so `White` without `stampBaby` cannot
            be told from a day with no stamp, and is stored as no stamp.
          example: White
        stampBaby:
          type: boolean
          description: The baby label drawn on top of the stamp colour.
          example: true
        isPeak:
          type: boolean
          description: A cycle can hold more than one peak day.
          example: true
        counterStart:
          type: integer
          minimum: 0
          maximum: 255
          description: Number of days to show a counter for. `0` means none.
          example: 3
        sexUnion:
          type: string
          enum: [Union, ReservedUnion, LastReportedUnion]
          description: |-
            *Narrowed.* This app records only **whether** there was a union, so all three values
            are stored the same way and export always writes `Union`.
          example: Union
        mucusNotObserved:
          type: boolean
          description: |-
            The user recorded nothing that day — the file-format name for `dayNotObserved` on
            the live `Day`.

            It cannot be combined with an observation: `codifiedMucusObservation`,
            `codifiedMucusSensation`, `codifiedBleedingObservation`, `codifiedCervixHeight`,
            `codifiedCervixConsistency`, `freeMucusObservation`, `freeMucusSensation`,
            `booleanCervixMucus` or `booleanCervixAperture` on the same day rejects the file.
          example: true
        booleanPregnancyDetected:
          type: boolean
          example: false
        temperature:
          type: number
          description: |-
            Basal body temperature, a real number. Stored to two decimals, and must be between
            **30 and 45 °C** — anything else rejects the file.
          example: 36.75
        temperatureTime:
          type: string
          pattern: '^\d{2}:\d{2}:\d{2}$'
          description: When it was taken, `hh:mm:ss`. Ignored without a `temperature`.
          example: "06:45:00"
        freeMucusSensation:
          type: array
          maxItems: 20
          description: |-
            **Billings.** Free-text sensation labels. Each becomes a `sensation` description on
            the account, reusing an existing one of the same name. Max **256 characters** each.
          items:
            type: string
            maxLength: 256
          example: ["dry", "slippery"]
        freeMucusObservation:
          type: array
          maxItems: 20
          description: "**Billings.** Free-text observation labels, as above but typed `observation`."
          items:
            type: string
            maxLength: 256
          example: ["clear and stretchy"]
        codifiedBleedingObservation:
          type: string
          maxLength: 32
          description: |-
            **FertilityCare:** `VH`, `H`, `M`, `L`, `VL`, `Br` (stored as `B`).

            **Any other method:** *narrowed.* There is no bleeding field outside FertilityCare
            here, so a value becomes a **Red stamp** when the day has no `stampColor` of its
            own, and is reported otherwise. This is how a `symptothermic_fr`
            `Traces`/`Medium`/`Heavy` is kept.
          example: VH
        codifiedMucusSensation:
          type: string
          maxLength: 32
          description: |-
            **FertilityCare:** `0`, `2`, `2W`, `4`, `6`, `8`, `10`, `10DL`, `10SL`, `10WL`.

            *Not stored for other methods*: the same key holds a different vocabulary under
            `symptothermic_fr` (`Dry`/`Humid`/`Wet`/`Lubricated`), which has no equivalent here.
          example: "10DL"
        codifiedMucusObservation:
          type: string
          maxLength: 32
          description: |-
            **FertilityCare:** `C`, `C/K` (stored as `CK`), `K`, `G`, `L`, `P`, `Y`.
            *Not stored for other methods*, as above.
          example: K
        codifiedNumberObservations:
          type: string
          maxLength: 16
          description: "**FertilityCare:** `x1`, `x2`, `x3`, `AD`. Stored and exported uppercase (`X1`)."
          example: X2
        codifiedPainObservations:
          type: string
          maxLength: 16
          description: "**FertilityCare:** `AP`, `RAP`, `LAP`."
          example: AP
        codifiedArrow:
          type: string
          enum: [Up, Down, Right]
          description: "**FertilityCare.** *Not stored for other methods.*"
          example: Up
        nonUsualBleeding:
          type: boolean
          description: "*Not stored.* This app has no spotting flag of its own."
        booleanCervixMucus:
          type: boolean
          description: "*Not stored.* Cervix observations are not recorded here."
        booleanCervixAperture:
          type: boolean
          description: "*Not stored.* Cervix observations are not recorded here."
        codifiedCervixConsistency:
          type: string
          maxLength: 32
          description: "*Not stored.* Cervix observations are not recorded here."
        codifiedCervixHeight:
          type: string
          maxLength: 32
          description: "*Not stored.* Cervix observations are not recorded here."
        codifiedTemperatureParasitic:
          type: string
          maxLength: 64
          description: "*Not stored.* No temperature-disturbance field is recorded here."
        temperatureCaptureOffset:
          type: integer
          minimum: -12
          maximum: 12
          description: "*Not stored.* Only an absolute `temperatureTime` is recorded here."
        codifiedEvents:
          type: array
          maxItems: 32
          description: "*Not stored.* No pre-defined event list is recorded here."
          items:
            type: string
            maxLength: 128
        babyFeedCount:
          type: integer
          minimum: 0
          maximum: 99
          description: "*Not stored.* No feed count is recorded here."
        codifiedManualFertility:
          type: string
          maxLength: 64
          description: "*Not stored.* Fertility is computed for display, not stored."

    ImportReport:
      type: object
      description: |-
        What `POST /import` did. Returned inside the usual `data` envelope, on success and on a
        dry run alike.

        The three report lists are the point of this answer: **nothing the file carries is
        dropped without appearing in one of them.** Show them to the user.
      properties:
        dryRun:
          type: boolean
          description: True when `dryRun=1` was sent, so nothing was written.
          example: false
        overide:
          type: boolean
          description: The `overide` value that was applied.
          example: false
        schemaVersion:
          type: string
          description: The version the file declared.
          example: "1.0"
        sourceApp:
          type: string
          description: The app the file says wrote it.
          example: moncycle.app
        cyclesRead:
          type: integer
          description: Cycles found in the file.
          example: 2
        daysRead:
          type: integer
          description: Day entries found, including the empty ones.
          example: 58
        daysToWrite:
          type: integer
          description: |-
            Days the file actually asks to write — `daysRead` minus the gaps. On a dry run this
            is what a real import would attempt.
          example: 54
        daysWritten:
          type: integer
          description: "`daysCreated` + `daysOverwritten`. Absent on a dry run."
          example: 54
        daysCreated:
          type: array
          description: Dates that had no data and were created.
          items:
            type: string
            format: date
          example: ["2026-03-10", "2026-03-11"]
        daysOverwritten:
          type: array
          description: Dates that already had data and were replaced (`overide=1` only).
          items:
            type: string
            format: date
          example: []
        daysSkipped:
          type: array
          description: |-
            Dates left untouched because they already had data and `overide` was `0`. Re-send
            with `overide=1` to replace them.
          items:
            type: string
            format: date
          example: ["2026-03-09"]
        descriptionsCreated:
          type: integer
          description: Free-text labels that did not exist on the account yet and were added.
          example: 3
        warnings:
          type: array
          description: |-
            Accepted, but worth telling the user — typically a cycle whose `method` differs from
            the account's, or a method this app does not record.
          items:
            type: string
          example:
            - "[cycles[0]] the cycle uses 'fertilityCare' while this account is set to 'billings'. The data was imported; change the method in the account settings to see it."
        mappedFields:
          type: array
          description: |-
            Stored, but as something narrower than the file said. The cases are: a bleeding
            value outside FertilityCare becoming a Red stamp, a `ReservedUnion` /
            `LastReportedUnion` becoming a plain union, a `White` stamp with no baby label
            becoming no stamp, and a free-text label the file uses under both types keeping
            the single type it has on the account.
          items:
            type: string
          example:
            - "[2007-01-25] codifiedBleedingObservation 'Heavy' stored as a Red stamp (symptothermic_fr records bleeding as a stamp)."
            - "[2007-02-06] sexUnion 'ReservedUnion' stored as a plain union: day_timeline records only whether there was one."
            - "[2024-08-01] 'humide' is recorded as a sensation on this account and stays one: a label carries a single type here."
        ignoredFields:
          type: array
          description: |-
            Carried by the file with nowhere to put it here. Each line reads
            `[where] field: why`.
          items:
            type: string
          example:
            - "[file] userInformation: the account's own identity is never changed by an import."
            - "[2007-01-25] codifiedManualFertility: fertility is computed for display, not stored."

  securitySchemes:

    HTTPtoken:
      type: http
      scheme: Bearer
      description: |-
        The token from `POST /login`, in the `Authorization` header:

        ```
        Authorization: Bearer <token>
        ```

        Use this for apps, scripts and mobile clients. It wins over the cookie if both are sent.
        The token does not expire. `GET /logout` destroys the one you send.

    HTTPcookie:
      type: apiKey
      in: cookie
      name: MONCYCLEAPP_TOKEN
      description: |-
        The same token, in a cookie. `POST /login` sets it for you (HttpOnly, 5 years), so a
        browser client has nothing to store.

        The same cookie name also carries the **captcha** session before login, which is why
        `GET /captcha` and the call that follows it must share a cookie jar.
