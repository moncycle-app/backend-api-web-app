openapi: 3.0.3
info:
  title: MONCYCLE.APP API
  description: |-
    Documentation de l'API REST de moncycle.app! L'application fonctionne sur la base d'une timeline d'observations. 1 observation => 1 jour.
    Ainsi la lecture d'un cycle ou sa modification se fait via le call API observation.
    Un nouveau cycle est caracterisé par un attribut lié au premier jour du cycle en question.

    All endpoints below speak JSON: request bodies for POST/PUT/DELETE are `application/json`
    (not form-urlencoded), every response is either `{"data": ...}` on success or
    `{"error": {"code", "message", "details"?}}` on failure, and real HTTP status codes are
    used throughout (see the `Error` schema for the stable `code` values). `/export` and
    `/import` are the exception: they speak the separate, versioned NFP file format
    (`schemaVersion`/`source_app`/...), not this envelope, since that's a portable file
    format rather than a live resource.
  license:
    name: CC BY-NC-SA
    url: https://creativecommons.org/licenses/by-nc-sa/4.0
  version: "2.0"
externalDocs:
  description: www.moncycle.app
  url: hhttps://www.moncycle.app
servers:
  - url: .
  - url: https://tableau.moncycle.app/api
tags:
  - name: general
    description: general information about the server (no personal information)
  - name: account
    description: login, account modifications, register, TOTP, …
  - name: observations
    description: creation, modification, and reading of observations and menstrual cycle data

paths:

  /version:
    get:
      tags:
        - general
      summary: Server and API version
      responses:
        200:
          description: OK


  /pub_stat:
    get:
      tags:
        - general
      summary: Public statistics
      responses:
        200:
          description: OK


  /health_check:
    get:
      tags:
        - general
      summary: Server health status for monitoring
      responses:
        200:
          description: Server is responding and the database connection is working.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [ok]
        503:
          description: "`database_unreachable`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'



  /login:
    post:
      tags:
        - account
      summary: Creation of a token (API key)
      requestBody:
        description: Identification data (email, password, TOTP)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        200:
          description: >-
            Authenticated (password only, password + TOTP, or already authenticated via the
            existing cookie/bearer token). See `totpUsed`/`alreadyAuthenticated` in the body to
            tell which.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: Auth token (also set as the MONCYCLEAPP_TOKEN cookie). Absent when alreadyAuthenticated is true.
                      userId:
                        type: integer
                      totpUsed:
                        type: boolean
                      alreadyAuthenticated:
                        type: boolean
                      captchaRequired:
                        type: boolean
                        description: Hint that the *next* login attempt on this account will require a captcha, regardless of whether this one succeeded.
        400:
          description: "`missing_credentials`: email and/or password missing or empty."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        401:
          description: "`invalid_credentials` | `totp_required` | `totp_invalid`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        403:
          description: "`login_disabled` | `captcha_required` | `account_disabled` | `account_locked`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        429:
          description: "`rate_limited`: too many attempts from this network, try again later."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'


  /logout:
    get:
      tags:
        - account
      summary: Deletion of an authentication token
      description: >-
        Called as a plain top-level navigation (an `<a href>`, not XHR/fetch) by the web
        frontend, so it responds with a redirect rather than a JSON body.
      responses:
        303:
          description: Logged out (idempotent -- also returned if already logged out). Redirects to /auth.
      security:
        - HTTPcookie: []
        - HTTPtoken: []


  /password_change:
    post:
      tags:
        - account
      summary: Password change
      requestBody:
        content:
          application/json:
            schema:
              required:
                - oldPassword
                - newPassword
              type: object
              properties:
                oldPassword:
                  type: string
                newPassword:
                  type: string
                  description: Minimum 8 characters.
        required: true
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      changed:
                        type: boolean
        400:
          description: "`missing_fields`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        401:
          description: "Authentication required, or `invalid_password` (old password incorrect)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        422:
          description: "`password_too_short` | `password_unchanged`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []

  /register:
    post:
      tags:
        - account
      summary: creating a new account
      requestBody:
        content:
          application/json:
            schema:
              required:
                - firstName
                - email
                - birthYear
                - captcha
              type: object
              properties:
                firstName:
                  type: string
                  description: first name of woman of firtnames of couple that is using this app
                email:
                  type: string
                  description: login email address
                method:
                  type: string
                  description: NFP cycle tracking method. Defaults to "billings" if omitted.
                  enum:
                    - billings
                    - fertilityCare
                temperatureTracking:
                  type: boolean
                  description: Whether body temperature is also tracked alongside `method`. Defaults to false.
                birthYear:
                  type: integer
                  description: year of birth for stats (dont need to be precise +/- 2 years)
                captcha:
                  type: string
                  description: string contained in captcha imaged (obtained in another API call)
                discoveredComment:
                  type: string
                  description: awnser to quetion asked to user => how did you discovered this app ?
                okForResearch:
                  type: boolean
                  description: is user ok for sharing anonymous data for research
      responses:
        201:
          description: >-
            Account created. `welcomeEmailSent: false` means the account was created but the
            welcome email (containing the generated password) failed to send.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      userId:
                        type: integer
                      email:
                        type: string
                      name:
                        type: string
                      welcomeEmailSent:
                        type: boolean
        400:
          description: "`missing_fields` | `invalid_email` | `invalid_birth_year`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        403:
          description: "`registration_disabled` | `captcha_invalid`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        409:
          description: "`already_authenticated` | `account_exists`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'


  /captcha:
    get:
      tags:
        - account
      summary: >-
        create/refresh a captcha challenge image tied to the visitor's MONCYCLEAPP_TOKEN cookie.
        Called before 'register', and before 'login' once its response comes back with
        captcha_required = true.
      responses:
        200:
          description: OK



  /recover_password:
    post:
      tags:
        - account
      summary: reset password if lost based on email address
      description: >-
        Always returns 200 with `sent: true`, whether or not the account exists -- this is
        deliberate, to avoid leaking account existence via response differences or timing.
      requestBody:
        description: login email address that is used to authenticate
        content:
          application/json:
            schema:
              required:
                - email
              type: object
              properties:
                email:
                  type: string
                  description: login email address
        required: true
      responses:
        200:
          description: A new password was sent to the address if an account exists for it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
        400:
          description: "`missing_email` | `invalid_email`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'



  /totp:


    get:
      tags:
        - account
      summary: Initialization of TOTP secret before activation.
      description: >-
        TOTP (Time-Based One-Time Password) is a temporary, time-sensitive code used for
        two-factor authentication (2FA or MFA). `totpState` is one of `never_used`,
        `disabled`, `init`, `active`.
      responses:
        200:
          description: TOTP initiated (or already active -- see 409).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totpState:
                        type: string
                      initSecret:
                        type: string
                      otpauth:
                        type: string
                      qrcode:
                        type: string
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        409:
          description: "`totp_already_enabled`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []


    post:
      tags:
        - account
      summary: Send first TOTP code for final activation
      requestBody:
        content:
          application/json:
            schema:
              required:
                - code
              type: object
              properties:
                code:
                  type: integer
                  description: Code generated in TOTP application
        required: true
      responses:
        200:
          description: TOTP successfully activated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totpState:
                        type: string
        400:
          description: "`totp_code_missing`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        401:
          description: "Authentication required, or `totp_invalid`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        409:
          description: "`totp_already_enabled`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []


    delete:
      tags:
        - account
      summary: TOTP deactivation for account
      parameters:
        - name: code
          in: query
          description: Code currently generated in the user's TOTP application
          required: true
          schema:
            type: integer
      responses:
        200:
          description: TOTP successfully deactivated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totpState:
                        type: string
        400:
          description: "`totp_code_missing`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        401:
          description: "Authentication required, or `totp_invalid`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        409:
          description: "`totp_not_enabled`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []



  /account:



    post:
      tags:
        - account
      summary: Modification of account information
      description: Every field is optional; only the fields present in the body are updated.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The first names of the people to whom this account belongs
                secondaryEmail:
                  type: string
                  description: Second email address to receive the cycles via email on a different address
                method:
                  type: string
                  enum:
                    - billings
                    - fertilityCare
                temperatureTracking:
                  type: boolean
                  description: Whether body temperature is also tracked alongside `method`. Only applied if `method` or `temperatureTracking` is present.
                birthYear:
                  type: integer
                timelineAscending:
                  type: boolean
                  description: Order of displaying observations (true => today at the beginning of the table).
                research:
                  type: boolean
                  description: Consent to contribute anonymously to research programs.
                sponsor:
                  type: boolean
                lastWriteClientUtc:
                  type: string
                  description: Client-side UTC update timestamp, ISO 8601. Set by the server if not present.
                  format: date-time
                  example: "2025-01-23T15:30:45Z"
        required: true
      responses:
        200:
          description: OK -- the fields that were actually updated are listed in `fieldsUpdated`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                      fieldsUpdated:
                        type: array
                        items:
                          type: string
                      lastWriteClientUtc:
                        type: string
                        format: date-time
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []



    delete:
      tags:
        - account
      summary: User account deletion
      requestBody:
        content:
          application/json:
            schema:
              required:
                - password
              type: object
              properties:
                password:
                  type: string
                  description: Account password
        required: true
      responses:
        204:
          description: Account deleted.
        400:
          description: "`missing_password`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        401:
          description: "Authentication required, or `invalid_password`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []



  /all_of_my_data_plz:
    get:
      tags:
        - account
      summary: Export of all account-related data in CSV format (for GDPR)
      responses:
        200:
          description: OK
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []


  /key_infos:
    get:
      tags:
        - observations
      summary: Reading key informations from user and menstrual cycle.
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      userId:
                        type: integer
                      email:
                        type: string
                      secondaryEmail:
                        type: string
                        nullable: true
                      method:
                        type: string
                        enum: [billings, fertilityCare]
                      temperatureTracking:
                        type: boolean
                      birthYear:
                        type: integer
                      name:
                        type: string
                      inscriptionDate:
                        type: string
                        format: date-time
                      sponsor:
                        type: boolean
                      research:
                        type: boolean
                      timelineAscending:
                        type: boolean
                      allCyclesFirstDay:
                        type: array
                        items:
                          type: string
                          format: date
                      allPregnancyDates:
                        type: array
                        items:
                          type: string
                          format: date
                      totpState:
                        type: string
                        enum: [never_used, disabled, init, active]
                      lastWriteClientUtc:
                        type: string
                        format: date-time
                        nullable: true
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []



  /day:


    get:
      tags:
        - observations
      summary: Reading daily observations.
      description: >-
        It either returns the specific dates requested (via the "date" parameter) or all dates
        within a specified range (using the "start_date" and "end_date" parameters). If no
        dates or parameters are specified, it returns all daily observations for that account.
        The result is an object keyed by date (`"YYYY-MM-DD": Day`), except when there is no
        matching data at all, in which case `data` is an empty array rather than an empty
        object (a plain artifact of PHP's array/object JSON encoding, not a distinct shape to
        handle).
      parameters:
        - name: date
          in: query
          description: Multiple dates (at least one) in the format YYYY-MM-DD, separated by commas
          schema:
            type: string
            format: date
            pattern: '^\s*\d{4}-\d{2}-\d{2}(\s*,\s*\d{4}-\d{2}-\d{2})*\s*$'
        - name: start_date
          in: query
          description: One date in the format YYYY-MM-DD (should be used with 'end_date' param)
          schema:
            type: string
            format: date
            pattern: '^\s*\d{4}-\d{2}-\d{2}\s*$'
        - name: end_date
          in: query
          description: One date in the format YYYY-MM-DD (should be used with 'start_date' param)
          schema:
            type: string
            format: date
            pattern: '^\s*\d{4}-\d{2}-\d{2}\s*$'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/Day'
        400:
          description: "`invalid_date` | `invalid_date_range`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []


    post:
      tags:
        - observations
      summary: Writing of a daily observation
      description: >-
        Upsert semantics, same as before: this writes the full state of the day, not a sparse
        patch, so a field omitted from the body is written as empty/false (send the current
        full Day, not just the fields that changed).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Day'
        required: true
      responses:
        200:
          description: Existing day updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Day'
        201:
          description: New day created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Day'
        400:
          description: "`invalid_json` | `invalid_date`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []


    delete:
      tags:
        - observations
      summary: Deletion of a daily observation
      parameters:
        - name: date
          in: query
          description: Date of observation in the format YYYY-MM-DD
          required: true
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        204:
          description: OK
        400:
          description: "`invalid_date`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []


  /description:
    # NOTE: kept singular (not renamed to /descriptions) because this pass doesn't update the
    # JS frontend that calls it -- renaming the URL would break it with no way to fix it in
    # the same pass. Revisit when the frontend is updated to match.


    get:
      tags:
        - observations
      summary: Reading of all descriptions existing in DB sorted by most used.
      description: Field 'useCount' gives the number of days an observation is used on.
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Description'
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []



    post:
      tags:
        - observations
      summary: Creating or updating descriptions.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: description to be created (or renamed)
                type:
                  type: string
                  enum:
                    - undefined
                    - observation
                    - sensation
                id:
                  type: integer
                  description: ID of the description to rename/retype. Omit to create a new one.
                lastWriteClientUtc:
                  type: string
                  format: date-time
              required:
                - name
                - type
        required: true
      responses:
        200:
          description: Existing description updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Description'
        201:
          description: New description created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Description'
        400:
          description: "`missing_fields` | `invalid_id` | `invalid_type`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        404:
          description: "`not_found`: `id` does not match a known description."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        409:
          description: "`duplicate_name`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []


    delete:
      tags:
        - observations
      summary: Deletion of a description.
      parameters:
        - name: id
          in: query
          description: ID of the description to delete
          required: true
          schema:
            type: integer
      responses:
        204:
          description: OK
        400:
          description: "`missing_id` | `invalid_id`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        404:
          description: "`not_found`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []


  /sync:

    get:
      tags:
        - observations
      summary: List of daily observations and description modified since specified date for synchronization between clients and the server.
      parameters:
        - name: fromTimestamp
          in: query
          description: A UTC timestamp, ISO 8601 or the bare "YYYY-MM-DD hh:mm:ss" form.
          required: true
          schema:
            type: string
            format: date-time
            example: "2025-01-23T15:30:45Z"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      days:
                        type: array
                        items:
                          $ref: '#/components/schemas/Day'
                      descriptions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Description'
        400:
          description: "`missing_parameter` | `invalid_timestamp`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      security:
        - HTTPcookie: []
        - HTTPtoken: []



  /export:
    get:
      tags:
        - observations
      summary: Export cycle data in NFP, CSV or PDF format
      parameters:
        - name: type
          in: query
          description: File format to be returned
          required: true
          schema:
            type: string
            enum:
              - nfp
              - pdf
              - csv
        - name: start_date
          in: query
          description: Date of first day to export in YYYY-MM-DD format
          required: true
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: end_date
          in: query
          description: Date of last day to export in YYYY-MM-DD format
          required: true
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: json_in_page
          in: query
          description: 1 => return NFP data (JSON) directly in the current page, 0 => start a file download
          required: false
          schema:
            type: integer
            default: 0
            enum:
              - 1
              - 0
        - name: anonymous
          in: query
          description: Make anonymous pdf export (0 => no, 1 => yes)
          required: false
          schema:
            type: integer
            default: 0
            enum:
              - 1
              - 0
      responses:
        200:
          description: OK
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []

  /import:
    post:
      tags:
        - observations
      summary: Import NFP files (a JSON based file type)
      description: Raw JSON string import from a NFP file.
      parameters:
        - name: overide
          in: query
          description: Overide existing data (0 => no, 1 => yes)
          required: false
          schema:
            type: integer
            default: 0
            enum:
              - 1
              - 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              example: {"metadata": {"version": "1.2"}, "data": [{"id": 1, "value": 10}]}
      responses:
        200:
          description: Successfully imported
        400:
          description: Import error
        401:
          description: Authentication required


components:
  schemas:


    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >-
            Stable, machine-readable slug. See each endpoint's responses for the codes it can
            return (e.g. `invalid_credentials`, `unauthorized`, `not_found`, `duplicate_name`).
        message:
          type: string
          description: Human-readable explanation, not meant to be parsed.
        details:
          type: object
          description: Optional extra structured context (e.g. `captchaRequired`).

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'

    LoginRequest:
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
          example: demo.bill@moncycle.app
          description: Login email address
        password:
          type: string
          example: demo
          description: Login password
        code:
          type: integer
          description: One time pass code (TOTP)
        captcha:
          type: string
          description: >-
            Answer to the image served by /captcha (same challenge/cookie mechanism
            as account registration). Only required once the response to a previous /login
            call came back with captchaRequired = true.

    Day:
      type: object
      required:
        - date
      description: >-
        The shape used by /day and /sync, and (inside cycles[].days[]) by the NFP file format
        served by /export and /import -- see that endpoint's docs for the differences between
        this live-resource shape and the portable file format.
      properties:
        date:
          type: string
          format: date
          description: Date of observation in YYYY-MM-DD format. Required on write; ignored on read.
        cycleStartDate:
          type: string
          format: date
          nullable: true
          description: Read-only. First day of the cycle this date belongs to.
        cycleDay:
          type: integer
          nullable: true
          description: Read-only. 1-based position of this date within its cycle.
        cycleFirstDay:
          type: boolean
          description: Start of a new cycle on this date.
        dayNotObserved:
          type: boolean
          description: No observation of any kind was recorded for this date.
        stampColor:
          type: string
          nullable: true
          enum: [Red, Green, Yellow, White]
          description: >-
            Stamp color. Note: "White" with stampBaby=false is indistinguishable from "no
            stamp at all" (both are stored as the same empty code) and round-trips back as
            null -- this app has never had a distinct code for a plain, colorless stamp.
        stampBaby:
          type: boolean
          description: Baby label on top of the stamp color.
        isPeak:
          type: boolean
          description: Peak day for the current cycle. Could be multiple per cycle.
        counterStart:
          type: integer
          nullable: true
          description: Start an extra days counter from this day, for this many days.
        sexUnion:
          type: boolean
          description: Sexual intercourse on that day.
        booleanPregnancyDetected:
          type: boolean
          description: Beginning of a pregnancy.
        freeMucusSensation:
          type: array
          items:
            type: string
          description: >-
            Free-text sensation labels (Billings method). Writing a name that doesn't exist
            yet creates it; writing an existing name that was created under
            freeMucusObservation keeps its original type (names are unique per account
            regardless of type, same as before this change).
        freeMucusObservation:
          type: array
          items:
            type: string
          description: Free-text observation labels (Billings method). See freeMucusSensation.
        temperature:
          type: number
          nullable: true
        temperatureTime:
          type: string
          nullable: true
          description: Time the temperature was taken, hh:mm:ss.
        codifiedBleedingObservation:
          type: string
          nullable: true
          description: FertilityCare method only. One of VH|H|M|VL|B, optionally suffixed "L" for spotting (e.g. "BL"), or just "L" for spotting alone.
        codifiedMucusSensation:
          type: string
          nullable: true
          description: FertilityCare method only. One of 0|2|2W|4|6|8|10|10DL|10SL|10WL.
        codifiedMucusObservation:
          type: string
          nullable: true
          description: FertilityCare method only. Any combination of C|G|K|P|Y|L.
        codifiedNumberObservations:
          type: string
          nullable: true
          description: FertilityCare method only. One of X1|X2|X3|AD.
        codifiedPainObservations:
          type: string
          nullable: true
          description: FertilityCare method only. One of AP|RAP|LAP.
        codifiedArrow:
          type: string
          nullable: true
          enum: [Up, Down, Right]
          description: FertilityCare method only.
        comment:
          type: string
        lastWriteClientUtc:
          type: string
          format: date-time
          nullable: true
          description: Client-side UTC update timestamp. Set by the server if not present on write.
        lastWriteDb:
          type: string
          format: date-time
          nullable: true
          description: Read-only. Server-side last-write timestamp.

    Description:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [undefined, observation, sensation]
        useCount:
          type: integer
          description: Number of days this description is currently associated with.


  securitySchemes:
    HTTPtoken:
      description: Token in the HTTP Authorization header
      type: http
      scheme: Bearer
    HTTPcookie:
      description: Token in an HTTP cookie
      type: apiKey
      in: cookie
      name: MONCYCLEAPP_TOKEN
