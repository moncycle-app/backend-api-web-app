openapi: 3.0.3
info:
  title: MONCYCLE.APP API
  description: |-
    Documentation de l'API REST de moncycle.app! L'application fonctionne sur la base d'une timeline d'observations. 1 observation => 1 jour.
    Ainsi la lecture d'un cycle ou sa modification se fait via le call API observation.
    Un nouveau cycle est caracterisé par un attribut lié au premier jour du cycle en question.
  license:
    name: CC BY-NC-SA
    url: https://creativecommons.org/licenses/by-nc-sa/4.0
  version: "1.0"
externalDocs:
  description: www.moncycle.app
  url: hhttps://www.moncycle.app
servers:
  - url: .
  - url: https://tableau.moncycle.app/api
tags:
  - name: general
    description: general information about the server (no personal information)
  - name: account
    description: login, account modifications, register, TOTP, …
  - name: observations
    description: creation, modification, and reading of observations and menstrual cycle data

paths:

  /version:
    get:
      tags:
        - general
      summary: Server and API version
      responses:
        200:
          description: OK


  /pub_stat:
    get:
      tags:
        - general
      summary: Public statistics
      responses:
        200:
          description: OK


  /health_check:
    get:
      tags:
        - general
      summary: Server health status for monitoring
      responses:
        "oookkk":
          description: Server is responding and connection to back-end DB is running.
        "kkkooo":
          description: Houston we have a problem (error).



  /login:
    post:
      tags:
        - account
      summary: Creation of a token (API key)
      requestBody:
        description: Identification data (email, password, TOTP)
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/auth'
        required: true
      responses:
        0 :
          description: "Unknown error."
        1 :
          description: "Login is disabled."
        2 :
          description: "Email and/or password missing."
        3 :
          description: "Account deactivated."
        4 :
          description: "Correct password but TOTP code is incorrect or missing."
        5 :
          description: "Incorrect password or non-existent account."
        6 :
          description: "Missing data."
        7 :
          description: "Missing or incorrect captcha (required after repeated failed attempts on this account; see captcha_required in the response)."
        8 :
          description: "Account temporarily locked after too many failed attempts. A correct password (and TOTP if enabled) still succeeds."
        9 :
          description: "Too many attempts from this network (IP-based throttling), try again later."
        100 :
          description: "Account successfuly authentificated (password only)."
        101 :
          description: "Account successfuly authentificated (password + TOTP)."
        102 :
          description : "Account already authentificated."


  /logout:
    get:
      tags:
        - account
      summary: Deletion of an authentication token
      responses:
        200:
          description: OK
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []


  /password_change:
    post:
      tags:
        - account
      summary: Password change
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - old_pw
                - pw1
              type: object
              properties:
                old_pw:
                  type: string
                  description: old password
                pw1:
                  type: string
                  description: new password
        required: true
      responses:
        200:
          description: OK
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []

  /register:
    post:
      tags:
        - account
      summary: creating a new account
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - firstname
                - email1
                - method
                - birth_year
                - captcha
                - discovered_comment
              type: object
              properties:
                firstname:
                  type: string
                  description: first name of woman of firtnames of couple that is using this app
                email1:
                  type: string
                  description: login email address
                method:
                  type: integer
                  description: |
                    NFP cycle tracking method 
                    * 1 => Billings + body temperature
                    * 2 => Billings
                    * 3 => FertilityCare
                    * 4 => FertilityCare + body temperature
                  enum :
                    - 1
                    - 2
                    - 3
                    - 4
                birth_year:
                  type: integer
                  description: year of birth for stats (dont need to be precise +/- 2 years)
                captcha:
                  type: string
                  description: string contained in captcha imaged (obtained in another API call)
                discovered_comment:
                  type: string
                  description: awnser to quetion asked to user => how did you discovered this app ?
                ok_for_research:
                  type: integer
                  description: is user ok for sharing anonymous data for research (1 => yes, 0 => no)
                  enum :
                    - 1
                    - 0
        required: true
      responses:
        0 :
          description: "Unknown error."
        1 :
          description: "Account already logged in (auth variable return logged in account number)."
        2 :
          description: "Account creation has been disabled."
        3 :
          description: "Missing data or user input."
        4 :
          description: "Provided email address is not valid."
        5 :
          description: "Error in captcha input."
        6 :
          description: "Account successfuly created but password sending has failed."
        7 :
          description: "Account already exist."
        8 :
          description: "Birth year is not reallistic."
        100 :
          description: "Account successfuly created"
      security:
        - HTTPcookie: []
        - HTTPtoken: []


  /captcha:
    get:
      tags:
        - account
      summary: >-
        create/refresh a captcha challenge image tied to the visitor's MONCYCLEAPP_TOKEN cookie.
        Called before 'register', and before 'login' once its response comes back with
        captcha_required = true.
      responses:
        200:
          description: OK



  /recover_password:
    post:
      tags:
        - account
      summary: reset password if lost based on email address
      requestBody:
        description: login email address that is used to authenticate
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - email1
              type: object
              properties:
                email1:
                  type: string
                  description: login email address
        required: true
      responses:
        0 :
          description: Unknown error.
        1 :
          description: Email address was not provided.
        2 :
          description: Email address provided is not valid.
        100 :
          description: New password sucessfully sent to provided email address (if account exist).



  /totp:


    get:
      tags:
        - account
      summary: Initialization of TOTP secret before activation.
      description: |
        TOTP (Time-Based One-Time Password) is a temporary, time-sensitive code used for two-factor authentication (2FA or MFA).

        Possible TOTP states per account (matching DB data) :
        * 0 : TOTP has nevers been activated.
        * 1 : TOTP is desactivated.
        * 2 : TOTP is initiated.
        * 3 : TOTP is active.
      responses:
        0 :
          description: "Unknown error."
        1 :
          description: "Two-factor authentication is already enabled."
        2 :
          description: "Two-factor authentication is not enabled."
        3 :
          description: "Entered TOTP code is not valid."
        4 :
          description: "TOTP one-time code not provided."
        100 :
          description: "Two-factor authentication via TOTP successfully enabled."
        101 :
          description: "Two-factor authentication via TOTP successfully disabeled."
        102 :
          description: "Two-factor authentication via TOTP successfully initiated."
      security:
        - HTTPcookie: []
        - HTTPtoken: []


    post:
      tags:
        - account
      summary: Send first TOTP code for final activation
      description: |
        TOTP (Time-Based One-Time Password) is a temporary, time-sensitive code used for two-factor authentication (2FA or MFA).

        Possible TOTP states per account (matching DB data) :
        * 0 : TOTP has nevers been activated.
        * 1 : TOTP is desactivated.
        * 2 : TOTP is initiated.
        * 3 : TOTP is active.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - tmp_code
              type: object
              properties:
                tmp_code:
                  type: integer
                  description: Code generated in TOTP application
        required: true
      responses:
        0 :
          description: "Unknown error."
        1 :
          description: "Two-factor authentication is already enabled."
        2 :
          description: "Two-factor authentication is not enabled."
        3 :
          description: "Entered TOTP code is not valid."
        4 :
          description: "TOTP one-time code not provided."
        100 :
          description: "Two-factor authentication via TOTP successfully enabled."
        101 :
          description: "Two-factor authentication via TOTP successfully disabeled."
        102 :
          description: "Two-factor authentication via TOTP successfully initiated."
      security:
        - HTTPcookie: []
        - HTTPtoken: []


    delete:
      tags:
        - account
      summary: TOTP deactivation for account
      description: |
        TOTP (Time-Based One-Time Password) is a temporary, time-sensitive code used for two-factor authentication (2FA or MFA).

        Possible TOTP states per account (matching DB data) :
        * 0 : TOTP has nevers been activated.
        * 1 : TOTP is desactivated.
        * 2 : TOTP is initiated.
        * 3 : TOTP is active.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - tmp_code
              type: object
              properties:
                tmp_code:
                  type: integer
                  description: Code generated in TOTP application
        required: true
      responses:
        0 :
          description: "Unknown error."
        1 :
          description: "Two-factor authentication is already enabled."
        2 :
          description: "Two-factor authentication is not enabled."
        3 :
          description: "Entered TOTP code is not valid."
        4 :
          description: "TOTP one-time code not provided."
        100 :
          description: "Two-factor authentication via TOTP successfully enabled."
        101 :
          description: "Two-factor authentication via TOTP successfully disabeled."
        102 :
          description: "Two-factor authentication via TOTP successfully initiated."
      security:
        - HTTPcookie: []
        - HTTPtoken: []



  /account:



    post:
      tags:
        - account
      summary: Modification of account information
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The first names of the people to whom this account belongs
                email2:
                  type: string
                  description: Second email address to receive the cycles via email on a different address
                nfp_method:
                  type: integer
                  description: |
                    Cycle tracking method 
                    * 1 => Billings + body temperature
                    * 2 => Billings
                    * 3 => FertilityCare
                    * 4 => FertilityCare + body temperature
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                age:
                  type: integer
                  description: Approximate year of birth
                timeline_asc:
                  type: integer
                  description: |
                    Order of displaying observations.
                    * 1 => today at the beginning of the table
                    * 0 => today at the end of the table
                  enum:
                    - 1
                    - 0
                research:
                  type: integer
                  description: |
                    Consent to contribute anonymously to research programs.
                    * 1 => yes
                    * 0 => no
                  enum:
                    - 1
                    - 0
                sponsor:
                  type: integer
                  description: |
                    This person id donating.
                    * 1 => yes
                    * 0 => no
                  enum:
                    - 1
                    - 0
                last_write_client_UTC:
                  type: string
                  description: client side UTC update timestamp, format should be YYYY-MM-DD HH:MM:SS. Will be set by server if not present.
                  format: string
                  example: "2025-01-23 15:30:45"
                  pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
        required: true
      responses:
        200:
          description: OK - the correctly modified fields are returned in the response
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []



    delete:
      tags:
        - account
      summary: User account deletion
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - pw_before_deletion
              type: object
              properties:
                pw_before_deletion:
                  type: string
                  description: Account password
        required: true
      responses:
        200:
          description: OK
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []



  /all_of_my_data_plz:
    get:
      tags:
        - account
      summary: Export of all account-related data in CSV format (for GDPR)
      responses:
        200:
          description: OK
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []


  /key_infos:
    get:
      tags:
        - observations
      summary: Reading key informations from user and menstrual cycle.
      responses:
        200:
          description: OK
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []



  /day:


    get:
      tags:
        - observations
      summary: Reading daily observations.
      description: It either returns the specific dates requested (via the "date" parameter) or all dates within a specified range (using the "start_date" and "end_date" parameters). If no dates or parameters are specified, it returns all daily observations for that account.
      parameters:
        - name: date
          in: query
          description: Multiple dates (at least one) in the format YYYY-MM-DD, separated by commas
          schema:
            type: string
            format: date
            pattern: '^\s*\d{4}-\d{2}-\d{2}(\s*,\s*\d{4}-\d{2}-\d{2})*\s*$'
        - name: start_date
          in: query
          description: One date in the format YYYY-MM-DD (should be used with 'end_date' param)
          schema:
            type: string
            format: date
            pattern: '^\s*\d{4}-\d{2}-\d{2}\s*$'
        - name: end_date
          in: query
          description: One date in the format YYYY-MM-DD (should be used with 'start_date' param)
          schema:
            type: string
            format: date
            pattern: '^\s*\d{4}-\d{2}-\d{2}\s*$'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/observation'
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []


    post:
      tags:
        - observations
      summary: Writing of a daily observation
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/observation'
        required: true
      responses:
        200:
          description: OK
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []


    delete:
      tags:
        - observations
      summary: Deletion of a daily observation
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - date
              properties:
                date:
                  type: string
                  description: Date of observation in the format YYYY-MM-DD
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                last_write_client_UTC:
                  type: string
                  description: client side UTC update timestamp, format should be YYYY-MM-DD HH:MM:SS. Will be set by server if not present.
                  format: string
                  example: "2025-01-23 15:30:45"
                  pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
        required: true
      responses:
        200:
          description: OK
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []


  /description:


    get:
      tags:
        - observations
      summary: Reading of all descriptions existing in DB sorted by most used.
      description: Field 'use_count' is giving the number of how many time an observation is used.
      responses:
        200:
          description: OK
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []



    post:
      tags:
        - observations
      summary: Creating or updating descriptions.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: description to be created (or renamed)
                type:
                  type: integer
                  description: |
                    type of description
                    * 0 => undefined
                    * 1 => observation
                    * 2 => sensation
                  enum:
                    - 0
                    - 1
                    - 2
                no_description:
                  type: integer
                  description: ID number of description to rename
                last_write_client_UTC:
                  type: string
                  description: client side UTC update timestamp, format should be YYYY-MM-DD HH:MM:SS. Will be set by server if not present.
                  format: string
                  example: "2025-01-23 15:30:45"
                  pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
              required:
                - name
                - type
      responses:
        200:
          description: OK
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []


    delete:
      tags:
        - observations
      summary: Deletion of a description.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                no_description:
                  type: integer
                  description: ID number of description to delete
              required:
                - no_description
        required: true
      responses:
        200:
          description: OK
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []


  /sync:

    get:
      tags:
        - observations
      summary: List of daily observations and description modified since specified date for synchronization between clients and the server.
      parameters:
        - name: fromTimestamp
          in: query
          description: A timestamp in the format YYYY-MM-DD hh:mm:ss, with the time in UTC.
          required: true
          schema:
            format: string
            example: "2025-01-23 15:30:45"
            pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
      responses:
        200:
          description: OK - observations are in a JSON array
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []



  /export:
    get:
      tags:
        - observations
      summary: Export cycle data in NFP, CSV or PDF format
      parameters:
        - name: type
          in: query
          description: File format to be returned
          required: true
          schema:
            type: string
            enum:
              - nfp
              - pdf
              - csv
        - name: start_date
          in: query
          description: Date of first day to export in YYYY-MM-DD format
          required: true
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: end_date
          in: query
          description: Date of last day to export in YYYY-MM-DD format
          required: true
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: json_in_page
          in: query
          description: 1 => return NFP data (JSON) directly in the current page, 0 => start a file download
          required: false
          schema:
            type: integer
            default: 0
            enum:
              - 1
              - 0
        - name: anonymous
          in: query
          description: Make anonymous pdf export (0 => no, 1 => yes)
          required: false
          schema:
            type: integer
            default: 0
            enum:
              - 1
              - 0
      responses:
        200:
          description: OK
        401:
          description: Authentication required
      security:
        - HTTPcookie: []
        - HTTPtoken: []

  /import:
    post:
      tags:
        - observations
      summary: Import NFP files (a JSON based file type)
      description: Raw JSON string import from a NFP file.
      parameters:
        - name: overide
          in: query
          description: Overide existing data (0 => no, 1 => yes)
          required: false
          schema:
            type: integer
            default: 0
            enum:
              - 1
              - 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              example: {"metadata": {"version": "1.2"}, "data": [{"id": 1, "value": 10}]}
      responses:
        200:
          description: Successfully imported
        400:
          description: Import error
        401:
          description: Authentication required


components:
  schemas:


    observation:
      type: object
      required:
        - date
      properties:
        date:
          type: string
          description: Date of observation in YYYY-MM-DD format
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
        cycle_1st_day:
          type: integer
          description: Start of a new cycle on this date (1 => yes, 0 => no)
          enum :
            - 1
            - 0
        stamp:
          type: string
          description: |
            Color stamp 
            * R red
            * G green
            * Y yellow
          enum :
            - "R"
            - "G"
            - "Y"
        baby:
          type: string
          description: Baby on stamp
          enum :
            - "BB"
        fc_score:
          type: string
          description: FertilityCare note for day
        fc_arrow:
          type: string
          description: Arrow related to the FertilityCare note
          enum :
            - "↑"
            - "↓"
            - "→"
        temp:
          type: number
          description: Body temperature
        time_temp_taken:
          type: string
          description: Timestamp of temperature measurement
        no_description:
            type: array
            description: Description IDs that should be associated with that day.
            items:
              type: integer
            style: form
            explode: true
        union_sex:
          type: integer
          description: Sex union on that day (1 => at least one, 0 => none)
          enum :
            - 1
            - 0
          default: 0
        is_peak:
          type: integer
          description: Peak day for current menstural cycle (1 => on that day, 0 => not that day)
          enum :
            - 1
            - 0
          default: 0
        counter_start:
          type: integer
          description: Extra days counting capabilities, number of days that should be counted starting this day
          default: 0
        day_not_observed:
          type: integer
          description: No observation on this date (1 => no data on this date, 0 => there is data)
          enum :
            - 1
            - 0
          default: 0
        pregnancy:
          type: integer
          description: Beginning of a pregnancy (1 => yes, 0 => no)
          enum :
            - 1
            - 0
          default: 0
        comment:
          type: string
          description: Free comment related that day
        last_write_client_UTC:
          type: string
          description: Last client update timestamp in YYYY-MM-DD HH:MM:SS format. Must be in UTC.
          format: string
          example: "2025-01-23 15:30:45"
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'


    auth:
      required:
        - email1
        - password
      type: object
      properties:
        email1:
          type: string
          example: demo.bill@moncycle.app
          description: Login email address
        password:
          type: string
          example: demo
          description: Login password
        code:
          type: integer
          description: One time pass code (TOTP)
        captcha:
          type: string
          description: >-
            Answer to the image served by /captcha (same challenge/cookie mechanism
            as account registration). Only required once the response to a previous /login
            call came back with captcha_required = true.


  securitySchemes:
    HTTPtoken:
      description: Token in the HTTP Authorization header
      type: http
      scheme: Bearer
    HTTPcookie:
      description: Token in an HTTP cookie
      type: apiKey
      in: cookie
      name: MONCYCLEAPP_TOKEN
