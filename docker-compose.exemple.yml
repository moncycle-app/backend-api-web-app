version: "3"

services:
  moncycle.app:
    hostname: 'MONCYCLE-APP-CONTAINER'
    container_name: moncycle_app
    image: jeanio/moncycle.app
    ports:
      # only the reverse proxy reaches it (a bare "8080:80" would publish on every interface)
      - "127.0.0.1:8080:80/tcp"
    environment:
      TZ: 'Europe/Paris'
      VIRTUAL_HOST: 'YOUR.DOMAINE.NAME'
      APP_URL: 'https://YOUR.DOMAINE.NAME/'
      DB_HOST: maria_db_hostname
      DB_ID: maria_db_login_id
      DB_NAME: maria_db_name
      DB_PORT: 3306
      DB_PASSWORD_FILE: /run/secrets/db_password
      SMTP_HOST: smtp_server_host_name
      SMTP_PORT: 465
      SMTP_MAIL: smtp_email_and_mogin_id
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      PHP_CACHE: 1
      # the app log goes to `docker logs` (stdout) by default; to keep it in a file, mount a volume on
      # /var/log/moncycle (below), name the file in it, and run the cron as www-data (README, "Logs")
      # LOG_OUTPUT: /var/log/moncycle/app.log
      # LOG_LEVEL: info
      # LOG_IP: truncate
    secrets:
      - db_password
      - smtp_password
    # the app never writes to its disk (but for its log file, in the volume below, if you use one)
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/health_check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # the default json-file driver never rotates, and the app log holds IP addresses and account ids
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # volumes:
    #   - moncycle_logs:/var/log/moncycle
    restart: unless-stopped

# volumes:
#   moncycle_logs:

secrets:
    db_password:
      file: /path/to/your/db/password/file
    smtp_password:
      file: /path/to/your/smtp/password/file